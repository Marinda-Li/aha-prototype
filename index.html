<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Aha · 一声就记下</title>
<link rel="icon" href="assets/logo.png">
<style>
/* ============ v0.2 · 白底 Apple 风 + Dot 式便利贴 ============ */
:root{
  --bg:#FFFFFF; --ink:#111114; --ink-2:#6B6B72; --ink-3:#AEAEB6;
  --fill:#F2F2F5; --line:#ECECF0;
  --b0:#B9D9F2; --b1:#BCE8C9; --b2:#E3D6F7; --b3:#F5D3E0;   /* 便利贴描边轮换 */
  --green:#34C759; --red:#FF3B30;
  --shadow:0 4px 24px rgba(0,0,0,.06);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:#E9E9EE;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink)}

.phone{width:100%;max-width:400px;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:480px){
  .phone{height:min(844px,96vh);border-radius:44px;border:10px solid #151517;box-shadow:0 30px 80px rgba(0,0,0,.3)}
}
.view{flex:1;overflow-y:auto;overscroll-behavior:contain;display:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.active{display:block}

/* ============ 顶部（☰ 间接进灵感录） ============ */
.topbar{display:flex;align-items:center;padding:16px 18px 4px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--fill);border:none;font-size:17px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.iconbtn .cnt{position:absolute;top:-3px;right:-3px;background:var(--ink);color:#fff;font-size:9.5px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.topbar .sp{flex:1}
.topbar .logo{height:30px;border-radius:8px}

/* 问候区 */
.greet{padding:34px 26px 8px;text-align:center}
.greet .g-main{font-size:24px;font-weight:700;letter-spacing:.5px}
.greet .g-main::before{content:"“"}.greet .g-main::after{content:"”"}
.greet .g-sub{margin-top:8px;font-size:13px;color:var(--ink-3)}

/* ============ 便利贴卡（Dot 式：白卡 + 大引号 + 黑胶囊播放键） ============ */
.note{margin:16px 18px 4px;background:#fff;border:1.5px solid var(--b0);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px 12px;position:relative;animation:drop .45s cubic-bezier(.2,.9,.3,1.15);user-select:none}
.note.b0{border-color:var(--b0)}.note.b1{border-color:var(--b1)}.note.b2{border-color:var(--b2)}.note.b3{border-color:var(--b3)}
@keyframes drop{from{transform:translateY(-16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.qm{font-family:var(--serif);font-size:44px;line-height:1;color:#D8D8DE;position:absolute;pointer-events:none}
.qm.tl{top:8px;left:14px}.qm.br{bottom:44px;right:14px}
.oneliner{font-size:19px;font-weight:600;line-height:1.55;padding:22px 10px 6px;word-break:break-word}
.oneliner.loading{color:var(--ink-3);font-weight:400}
/* 黑胶囊播放键 */
.playpill{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-size:13px;cursor:pointer;margin:10px 0 4px 10px;font-family:var(--sans)}
.playpill .pp-ic{font-size:10px}
.playpill.playing{background:#000}
.playpill.playing .pp-bars i{animation:ppb .7s ease-in-out infinite alternate}
.pp-bars{display:inline-flex;align-items:center;gap:2px;height:12px}
.pp-bars i{width:2.5px;background:#fff;border-radius:2px;height:5px}
@keyframes ppb{from{transform:scaleY(.4)}to{transform:scaleY(1.6)}}
.note img.n-img{width:calc(100% - 20px);margin:8px 10px 2px;border-radius:14px;display:block}
/* 转写中骨架 */
.skel{padding:22px 10px 6px}
.skel i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#F0F0F3 25%,#E4E4EA 50%,#F0F0F3 75%);background-size:200% 100%;animation:shim 1.2s infinite;margin-bottom:10px}
.skel .sk-t{font-size:11px;color:var(--ink-3)}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
/* 分段摘要区 */
.sum{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.sum-head{display:flex;align-items:center;font-size:11.5px;color:var(--ink-3);padding:0 2px 6px}
.sum-head .swap{margin-left:auto;background:var(--fill);border:none;border-radius:999px;padding:5px 12px;font-size:11px;color:var(--ink-2);cursor:pointer}
.sum-body{font-size:14px;line-height:1.85;color:#3A3A40;padding:0 2px 2px;white-space:pre-wrap;word-break:break-word}
.sum-body .seg{display:block;opacity:0;transform:translateY(6px);animation:segIn .4s ease forwards;margin-bottom:6px}
.sum-body .seg .n{color:var(--ink-3);margin-right:6px;font-size:12px}
@keyframes segIn{to{opacity:1;transform:none}}
.sum-body .cursor{display:inline-block;width:8px;height:16px;background:var(--ink);border-radius:2px;vertical-align:-2px;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* 候选标签：点击亮起 */
.tagrow{display:flex;flex-wrap:wrap;gap:8px;padding:10px 2px 2px}
.kw{border:1px solid #E2E2E8;background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 13px;font-size:12px;cursor:pointer;transition:all .18s}
.kw.lit{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.04)}
.kw.hint{border-style:dashed;color:var(--ink-3)}
/* 卡脚 */
.foot{display:flex;align-items:center;gap:8px;padding:10px 2px 0;font-size:11px;color:var(--ink-3)}
.foot .kbadge{background:var(--fill);border-radius:8px;padding:2px 8px;font-size:10.5px;color:var(--ink-2)}
.foot .share{margin-left:auto;background:none;border:none;font-size:14px;color:var(--ink-2);cursor:pointer;padding:4px}

/* 空状态 */
.empty{padding:50px 30px;text-align:center;color:var(--ink-3);font-size:13px;line-height:2}
.empty img{width:120px;margin-bottom:6px}

/* ============ 底部输入条（键盘图标 + 按住说话长条） ============ */
.inputbar{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg)}
.kbd{width:46px;height:46px;border-radius:50%;background:var(--fill);border:none;font-size:19px;color:var(--ink);cursor:pointer;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
.talk{flex:1;height:52px;border-radius:999px;background:var(--fill);border:none;font-size:15.5px;color:var(--ink-2);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--sans);letter-spacing:1px;transition:all .15s}
.talk.pressing{background:var(--ink);color:#fff}

/* ============ 录音浮层：上滑选 Todo / 灵感 ============ */
.rec-ov{position:absolute;inset:0;background:rgba(15,15,20,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;z-index:40}
.rec-ov.on{display:block}
.rec-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:22px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;animation:rise .22s ease}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.cats{display:flex;justify-content:center;gap:34px;margin-bottom:6px;transition:opacity .2s;opacity:.35}
.cats.armed-zone{opacity:1}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2)}
.cat .c-ic{width:62px;height:62px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:24px;transition:all .15s;border:2px solid transparent}
.cat.armed .c-ic{background:var(--ink);color:#fff;transform:scale(1.14)}
.cat.armed{color:var(--ink);font-weight:600}
.rec-timer{font-size:32px;font-weight:300;font-variant-numeric:tabular-nums;margin-top:8px}
.rec-timer.warn{color:var(--red);font-weight:600}
.rec-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:48px;margin:8px 0 4px}
.rec-wave i{width:4px;border-radius:3px;background:var(--ink);transition:height .08s}
.rec-hint{font-size:12.5px;color:var(--ink-2);min-height:20px}
.rec-cancel{margin:10px auto 0;width:58px;height:58px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-2);transition:all .15s}
.rec-cancel.armed{background:var(--red);color:#fff;transform:scale(1.15)}
.rec-sub{font-size:10.5px;color:var(--ink-3);margin-top:8px}

/* ============ 全屏浮层：打字 / 图片附言 / 分享页 ============ */
.overlay{position:absolute;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
.overlay.on{display:flex}
.ov-bar{display:flex;align-items:center;padding:14px 16px}
.ov-bar button{background:none;border:none;font-size:15px;cursor:pointer;color:var(--ink-2);padding:6px}
.ov-bar .save{margin-left:auto;color:var(--ink);font-weight:600}
.ov-bar .draft{font-size:11px;color:var(--ink-3);margin-left:10px}
.overlay textarea{flex:1;border:none;outline:none;resize:none;background:transparent;color:var(--ink);font-size:17px;line-height:1.8;padding:14px 22px;font-family:var(--sans)}
.imgcom .preview{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.imgcom .preview img{max-width:100%;max-height:100%;border-radius:16px;box-shadow:var(--shadow)}
.imgcom textarea{flex:none;height:92px;margin:0 16px 16px;background:var(--fill);border-radius:14px;padding:14px 16px;font-size:15px}

/* 分享页（灵感录 → 生成图片分享） */
.share-ov{position:absolute;inset:0;background:rgba(15,15,20,.72);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:28px}
.share-ov.on{display:flex}
.share-ov .s-title{color:#fff;font-size:14px;letter-spacing:2px;opacity:.85}
.share-ov canvas{max-width:100%;max-height:64%;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.share-ov .s-btns{display:flex;gap:12px}
.share-ov button{border:none;border-radius:999px;padding:12px 24px;font-size:14px;cursor:pointer;font-family:var(--sans)}
.share-ov .dl{background:#fff;color:var(--ink);font-weight:600}
.share-ov .cl{background:rgba(255,255,255,.16);color:#fff}

/* ============ 灵感录 ============ */
.lib-head{display:flex;align-items:center;padding:16px 18px 4px}
.lib-head .t{font-size:22px;font-weight:700;margin-left:12px}
.pills{display:flex;gap:8px;padding:14px 18px 6px}
.pill{border:none;background:var(--fill);color:var(--ink-2);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
.pill.on{background:var(--ink);color:#fff;font-weight:600}
.pill .n{opacity:.6;font-size:11px;margin-left:3px}
.lib-reset{display:block;margin:26px auto 30px;background:none;border:none;color:var(--ink-3);font-size:11.5px;cursor:pointer}

/* Toast */
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);background:rgba(17,17,20,.92);color:#fff;font-size:13px;padding:10px 20px;border-radius:999px;opacity:0;transition:all .25s;z-index:90;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="phone" id="phone">

  <!-- ===== 灵感流（开屏首页） ===== -->
  <div class="view active" id="view-feed">
    <div class="topbar">
      <button class="iconbtn" id="menuBtn" onclick="switchTab('lib')">☰<span class="cnt" id="noteCnt">0</span></button>
      <div class="sp"></div>
      <img class="logo" src="assets/logo.png" alt="Aha">
      <div class="sp"></div>
      <button class="iconbtn" onclick="shuffleGreet()">⟳</button>
    </div>
    <div class="greet">
      <div class="g-main" id="greetMain">下午好！</div>
      <div class="g-sub" id="greetSub">一声就记下</div>
    </div>
    <div id="feedList"></div>
  </div>

  <!-- ===== 灵感录 ===== -->
  <div class="view" id="view-lib">
    <div class="lib-head">
      <button class="iconbtn" onclick="switchTab('feed')">‹</button>
      <div class="t">灵感录</div>
    </div>
    <div class="pills" id="pills">
      <button class="pill on" data-f="all">全部</button>
      <button class="pill" data-f="idea">✨ 灵感</button>

    </div>
    <div id="libList"></div>
    <button class="lib-reset" onclick="resetAll()">⟳ 重置演示数据</button>
  </div>

  <!-- ===== 底部输入条 ===== -->
  <div class="inputbar" id="inputbar">
    <button class="kbd" id="kbdBtn">⌨️</button>
    <button class="talk" id="talkBtn">按住说话</button>
  </div>

  <!-- ===== 录音浮层 ===== -->
  <div class="rec-ov" id="recOv">
    <div class="rec-panel">
      <div class="cats" id="cats">
        <div class="cat" id="catTodo"><div class="c-ic">✅</div>加到 Todo</div>
        <div class="cat" id="catIdea"><div class="c-ic">✨</div>记为灵感</div>
      </div>
      <div class="rec-timer" id="recTimer">0:00</div>
      <div class="rec-wave" id="recWave"></div>
      <div class="rec-hint" id="recHint">松手：记为灵感 · 上滑选择分类</div>
      <div class="rec-cancel" id="recCancel">✕</div>
      <div class="rec-sub">下滑到这里取消</div>
    </div>
  </div>

  <!-- ===== 打字 ===== -->
  <div class="overlay" id="editor">
    <div class="ov-bar">
      <button onclick="closeEditor()">‹ 返回</button>
      <span class="draft" id="draftHint"></span>
      <button class="save" onclick="saveText()">完成</button>
    </div>
    <textarea id="editorTa" placeholder="想到什么，写下来…"></textarea>
  </div>

  <!-- ===== 图片附言 ===== -->
  <div class="overlay imgcom" id="imgcom">
    <div class="ov-bar">
      <button onclick="closeImgcom()">‹ 返回</button>
      <button class="save" onclick="saveImage()">完成</button>
    </div>
    <div class="preview"><img id="imgPreview" alt=""></div>
    <textarea id="imgCaption" placeholder="配一句感受（可留空）…"></textarea>
  </div>

  <!-- ===== 分享页 ===== -->
  <div class="share-ov" id="shareOv">
    <div class="s-title">生成分享图</div>
    <canvas id="shareCanvas" width="1080" height="1350"></canvas>
    <div class="s-btns">
      <button class="cl" onclick="closeShare()">关闭</button>
      <button class="dl" onclick="downloadShare()">保存图片</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<script>
/* ============================================================
   Aha 可交互原型 v0.2
   白底 Apple 风 · Dot 式便利贴 · 上滑选 Todo/灵感 · LLM 摘要+关键词
   ============================================================ */
"use strict";
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const LS_KEY="aha_v2";
const DAY=86400000;

/* ============================================================
   ★ LLM 接入配置（提示词待用户提供后填入 prompts 即可生效）
   - endpoint 留空 → 自动走 Mock，全链路可先跑通
   - 填了 endpoint+apiKey → 走真实 OpenAI 兼容接口
   ============================================================ */
const LLM={
  endpoint:"",            // 例如 https://api.xxx.com/v1/chat/completions
  apiKey:"",
  model:"",
  prompts:{
    oneLiner:"",          // TODO(用户): 一句话概括提示词。变量 {{text}}
    segments:"",          // TODO(用户): 分段摘要提示词。变量 {{text}}
    keywords:""           // TODO(用户): 关键词/标签提取提示词。变量 {{text}}
  }
};
async function llm(task,text){
  if(LLM.endpoint&&LLM.apiKey&&LLM.prompts[task]){
    try{
      const prompt=LLM.prompts[task].replace("{{text}}",text);
      const r=await fetch(LLM.endpoint,{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+LLM.apiKey},
        body:JSON.stringify({model:LLM.model||"default",messages:[{role:"user",content:prompt}]})});
      const d=await r.json();
      const out=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
      const parsed=parseLLM(task,out);
      if(parsed)return parsed;
    }catch(e){/* 静默降级 Mock */}
  }
  return mockLLM(task,text);
}
function parseLLM(task,out){
  try{const j=JSON.parse(out.slice(out.indexOf("{"),out.lastIndexOf("}")+1));
    if(task==="oneLiner"&&j.oneLiner)return j.oneLiner;
    if(task==="segments"&&Array.isArray(j.segments)&&j.segments.length)return j.segments;
    if(task==="keywords"&&Array.isArray(j.keywords)&&j.keywords.length)return j.keywords.slice(0,5);
  }catch(e){}
  if(task==="oneLiner"&&out.trim())return out.trim().split("\n")[0].slice(0,40);
  return null;
}
/* ---- Mock 实现（真实提示词到位前的演示数据） ---- */
const KW_RULES=[
  [/产品|功能|用户|体验|设计|原型|需求/,"产品"],[/会议|上线|方案|汇报|项目|老板|客户/,"工作"],
  [/书|课程|论文|学会|读完|考试/,"学习"],[/累|烦|开心|焦虑|难过|失眠|压力|心情/,"情绪"],
  [/记得|别忘|提醒|要买|明天|快递|缴费|todo|待办/i,"待办"],[/咖啡|奶茶|饭|猫|狗|天气|地铁|电影|跑[步路]|喝水|瑞幸/,"生活"],
  [/灵感|想到|点子|如果|能不能|突然/,"灵感"],[/健康|锻炼|睡觉|休息/,"健康"],[/钱|预算|成本|价格/,"财务"],
];
function mockLLM(task,text){
  if(task==="oneLiner"){
    const s=(text||"").replace(/\s+/g,"");
    const cut=s.split(/[。！？!?,，；;]/).filter(Boolean)[0]||s;
    return cut.length>26?cut.slice(0,26)+"…":cut||"（空）";
  }
  if(task==="segments"){
    const ss=(text||"").split(/(?<=[。！？!?])/).map(x=>x.trim()).filter(Boolean);
    if(ss.length<=1)return[text||"（无内容）"];
    const segs=[];const per=Math.ceil(ss.length/3);
    for(let i=0;i<ss.length;i+=per)segs.push(ss.slice(i,i+per).join(""));
    return segs.slice(0,3);
  }
  if(task==="keywords"){
    const out=[];
    for(const[re,tag]of KW_RULES){if(re.test(text)&&!out.includes(tag))out.push(tag);if(out.length>=5)break}
    for(const pad of["灵感","生活","待办","情绪","工作"]){if(out.length>=3)break;if(!out.includes(pad))out.push(pad)}
    return out;
  }
  return null;
}

/* ============ 数据 ============ */
let S=null;
const audioBlobs={};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(S))}
function load(){try{S=JSON.parse(localStorage.getItem(LS_KEY))}catch(e){} if(!S||!S.notes)seed()}
function seedNote(ageMs,kind,text,oneLiner,segments,candTags,pickedTags,dur,i){
  return{id:uid()+i,kind,createdAt:Date.now()-ageMs,updatedAt:Date.now()-ageMs,
    assets:dur?[{id:uid(),kind:"audio",durationMs:dur}]:[],
    text,oneLiner,segments,candTags,pickedTags,tagsDone:true,summarized:true,
    transcribing:false,border:i%4};
}
function seed(){
  S={notes:[
    seedNote(1.5*3600000,"idea","突然想到，首页的重逢卡可以做成随机翻牌，每次打开都有新鲜感。这样用户每天愿意多打开一次。重逢率比捕获率更难做，也更值钱。","重逢卡做成随机翻牌，提升打开频次",["首页重逢卡可以做成随机翻牌","每次打开都有新鲜感，提高日活","重逢率比捕获率更难做也更值钱"],["产品","灵感","重逢率"],["产品","灵感"],23000,0),

/* ============ 工具 ============ */
function esc(s){return(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtTime(ts){
  const d=new Date(ts),now=new Date();
  const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const t0=new Date(now).setHours(0,0,0,0),d0=new Date(d).setHours(0,0,0,0);
  if(t0===d0)return "今天 "+hm;
  if(t0-d0===DAY)return "昨天 "+hm;
  if(d.getFullYear()===now.getFullYear())return(d.getMonth()+1)+"月"+d.getDate()+"日";
  return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}
function fmtDur(ms){const s=Math.round(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
let toastT=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2200)}

function noteHTML(n,showShare){
  const audio=n.assets.find(a=>a.kind==="audio");
  const img=n.assets.find(a=>a.kind==="image");
  let sticky="";
  if(n.transcribing){
    sticky='<div class="skel"><i style="width:88%"></i><i style="width:60%"></i><span class="sk-t">识别中…</span></div>';
  }else{
    sticky='<div class="qm tl">“</div>'+
      '<div class="oneliner'+(n.oneLiner?"":" loading")+'">'+esc(n.oneLiner||"总结中…")+'</div>'+
      '<div class="qm br">”</div>';
    if(img)sticky+='<img class="n-img" src="'+img.localPath+'">';
  }
  if(audio){
    sticky+='<button class="playpill" id="pp_'+n.id+'" onclick="playVoice(\''+n.id+'\')">'+
      '<span class="pp-ic">▶</span><span class="pp-bars"><i></i><i></i><i></i><i></i></span>'+fmtDur(audio.durationMs||0)+'</button>';
  }
  /* 分段摘要 / 原文切换 */
  let sum="";
  if(!n.transcribing&&(n.segments&&n.segments.length||n.text)){
    const body=n.showRaw?esc(n.text||""):
      (n.segments||[]).map((s,i)=>'<span class="seg"><span class="n">'+"①②③"[i]+'</span>'+esc(s)+"</span>").join("");
    sum='<div class="sum"><div class="sum-head">'+(n.showRaw?"原始原文":"分段摘要")+
      '<button class="swap" onclick="toggleRaw(\''+n.id+'\')">⇄ '+(n.showRaw?"摘要":"原文")+'</button></div>'+
      '<div class="sum-body" id="sum_'+n.id+'">'+body+'</div></div>';
  }
  /* 候选标签 */
  let tags="";
  if(n.candTags&&n.candTags.length){
    tags='<div class="tagrow">'+n.candTags.map(t=>{
      const lit=(n.pickedTags||[]).includes(t);
      return '<button class="kw'+(lit?" lit":"")+(n.tagsDone?"":" hint")+'" onclick="pickKw(\''+n.id+'\',\''+esc(t)+'\')">'+esc(t)+'</button>';
    }).join("")+'</div>';
  }
  const shareBtn=showShare?'<button class="share" onclick="openShare(\''+n.id+'\')">↗</button>':"";
  return '<div class="note b'+n.border+'" data-id="'+n.id+'">'+sticky+sum+tags+
    '<div class="foot"><span>'+fmtTime(n.createdAt)+'</span>'+
    '<span class="kbadge">'+(n.kind==="todo"?"✅ Todo":"✨ 灵感")+'</span>'+shareBtn+'</div></div>';
}
function renderFeed(){
  const list=$("#feedList");

function toggleRaw(id){const n=S.notes.find(x=>x.id===id);if(!n)return;n.showRaw=!n.showRaw;save();renderFeed();renderLib()}
function pickKw(id,tag){
  const n=S.notes.find(x=>x.id===id);if(!n)return;
  n.pickedTags=n.pickedTags||[];
  const i=n.pickedTags.indexOf(tag);
  if(i>=0)n.pickedTags.splice(i,1);else n.pickedTags.push(tag);

let playing=null;
function playVoice(id){
  const n=S.notes.find(x=>x.id===id);if(!n)return;
  const btn=$("#pp_"+id);const audio=n.assets.find(a=>a.kind==="audio");
  if(playing){playing.stop();if(playing.id===id)return}
  btn.classList.add("playing");btn.querySelector(".pp-ic").textContent="■";
  const total=audio.durationMs||5000,t0=Date.now();
  let el=null;
  if(audioBlobs[id]){el=new Audio(audioBlobs[id]);el.play().catch(()=>{})}
  const iv=setInterval(()=>{if(Date.now()-t0>=total)stop()},150);

  playing={id,stop};
}

/* ============ 录入后 LLM 流水线：概括 → 流式摘要 → 候选标签 ============ */
async function runPipeline(n){
  n.oneLiner=await llm("oneLiner",n.text);save();renderFeed();renderLib();
  const segs=await llm("segments",n.text);
  n.segments=[];save();
  const body=()=>$("#sum_"+n.id);
  renderFeed();renderLib();
  for(let i=0;i<segs.length;i++){           /* 逐段流式输出 */
    await new Promise(r=>setTimeout(r,520));
    n.segments.push(segs[i]);
    const el=body();
    if(el&&!n.showRaw){
      const sp=document.createElement("span");sp.className="seg";
      sp.innerHTML='<span class="n">'+"①②③"[i]+"</span>"+esc(segs[i]);
      el.appendChild(sp);
    }
  }
  n.candTags=await llm("keywords",n.text);
  n.summarized=true;save();renderFeed();renderLib();
}

/* ============================================================
   按住说话：松手默认灵感 · 上滑左=Todo 右=灵感 · 下滑取消
   ============================================================ */
const R={active:false,startY:0,startTs:0,zone:null,iv:null,raf:null,recorder:null,stream:null,analyser:null,actx:null,chunks:[]};
function buildWave(){$("#recWave").innerHTML=Array.from({length:26},()=>'<i style="height:6px"></i>').join("")}
async function startRec(e){
  if(R.active)return;
  R.active=true;R.zone=null;R.startTs=Date.now();R.chunks=[];
  R.startY=(e.touches?e.touches[0].clientY:e.clientY);
  $("#recOv").classList.add("on");buildWave();
  $("#recTimer").className="rec-timer";$("#cats").classList.remove("armed-zone");
  $("#catTodo").classList.remove("armed");$("#catIdea").classList.remove("armed");$("#recCancel").classList.remove("armed");
  $("#recHint").textContent="松手：记为灵感 · 上滑选择分类";
  $("#talkBtn").classList.add("pressing");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    R.stream=stream;
    const mime=MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"";
    R.recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
    R.recorder.ondataavailable=ev=>{if(ev.data.size)R.chunks.push(ev.data)};
    R.recorder.start();
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser();an.fftSize=64;src.connect(an);R.analyser=an;R.actx=ctx;
  }catch(err){R.recorder=null}
  R.iv=setInterval(tickRec,200);waveLoop();
}
function tickRec(){
  const s=Math.floor((Date.now()-R.startTs)/1000),t=$("#recTimer");
  t.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  if(s>=55){t.classList.add("warn");t.textContent+=" · "+(60-s)+"s"}
  if(s>=60)finishRec();
}
function waveLoop(){
  if(!R.active)return;
  const bars=$("#recWave").children;let data=null;
  if(R.analyser){data=new Uint8Array(R.analyser.frequencyBinCount);R.analyser.getByteFrequencyData(data)}
  for(let i=0;i<bars.length;i++){
    let h=data?4+(data[Math.floor(i*data.length/bars.length)]/255)*40:4+Math.random()*38;
    bars[i].style.height=h.toFixed(0)+"px";
  }
  R.raf=requestAnimationFrame(waveLoop);
}
function moveRec(e){
  if(!R.active)return;
  const pt=e.touches?e.touches[0]:e;
  const dy=R.startY-pt.clientY;              /* 上滑为正 */
  const mid=window.innerWidth/2;
  let zone=null;
  if(dy>60)zone=pt.clientX<mid?"todo":"idea";
  else if(dy<-70)zone="cancel";
  if(zone!==R.zone){
    R.zone=zone;
    $("#cats").classList.toggle("armed-zone",zone==="todo"||zone==="idea");
    $("#catTodo").classList.toggle("armed",zone==="todo");
    $("#catIdea").classList.toggle("armed",zone==="idea");
    $("#recCancel").classList.toggle("armed",zone==="cancel");
    $("#recHint").textContent=zone==="todo"?"松手：加到 Todo":zone==="idea"?"松手：记为灵感":zone==="cancel"?"松手取消这条":"松手：记为灵感 · 上滑选择分类";
  }
}
function finishRec(){
  if(!R.active)return;
  R.active=false;clearInterval(R.iv);cancelAnimationFrame(R.raf);
  const dur=Date.now()-R.startTs,zone=R.zone;
  $("#recOv").classList.remove("on");$("#talkBtn").classList.remove("pressing");
  const done=blob=>{
    if(R.stream)R.stream.getTracks().forEach(t=>t.stop());
    if(R.actx)R.actx.close().catch(()=>{});
    if(zone==="cancel"){toast("已取消");return}
    if(dur<600){toast("说话时间太短");return}
    const kind=zone==="todo"?"todo":"idea";
    const n=addNote(kind,{assets:[{id:uid(),kind:"audio",durationMs:dur}],transcribing:true});
    if(blob)audioBlobs[n.id]=URL.createObjectURL(blob);
    setTimeout(async()=>{                 /* Mock ASR → LLM 流水线 */
      n.text=MOCK_TRANSCRIPTS[Math.floor(Math.random()*MOCK_TRANSCRIPTS.length)];
      n.transcribing=false;n.updatedAt=Date.now();save();renderFeed();renderLib();
      await runPipeline(n);
    },1400);
  };
  if(R.recorder&&R.recorder.state!=="inactive"){
    R.recorder.onstop=()=>done(new Blob(R.chunks,{type:R.recorder.mimeType||"audio/mp4"}));
    R.recorder.stop();
  }else done(null);
}
(function bindTalk(){
  const b=$("#talkBtn");
  b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);startRec(e)});
  b.addEventListener("pointermove",e=>{e.preventDefault();moveRec(e)});
  b.addEventListener("pointerup",()=>finishRec());
  b.addEventListener("pointercancel",()=>finishRec());
  b.addEventListener("contextmenu",e=>e.preventDefault());
})();

/* ============================================================
   分享页（灵感录 → 生成图片分享）
   ============================================================ */
const BORDERS=["#B9D9F2","#BCE8C9","#E3D6F7","#F5D3E0"];
let shareId=null;
function openShare(id){
  const n=S.notes.find(x=>x.id===id);if(!n)return;
  shareId=id;
  const cv=$("#shareCanvas"),ctx=cv.getContext("2d"),W=1080,H=1350;
  ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,W,H);
  const m=90,cw=W-2*m,ch=H-2*m-30;
  /* 便利贴白卡 + 彩色描边 */
  ctx.fillStyle="#FFFFFF";ctx.strokeStyle=BORDERS[n.border]||BORDERS[0];ctx.lineWidth=6;
  rr(ctx,m,m,cw,ch,44);ctx.fill();ctx.stroke();
  /* 引号 */
  ctx.fillStyle="#D8D8DE";ctx.font='120px "Songti SC",serif';
  ctx.fillText("“",m+48,m+170);
  ctx.textAlign="right";ctx.fillText("”",m+cw-48,m+ch-40);ctx.textAlign="left";
  /* 一句话概括 */
  ctx.fillStyle="#111114";ctx.font='600 56px -apple-system,"PingFang SC",sans-serif';
  wrapText(ctx,n.oneLiner||n.text||"",m+70,m+250,cw-140,88);
  /* 播放键示意（不含原音） */
  const audio=n.assets.find(a=>a.kind==="audio");
  if(audio){
    const py=m+ch-190;
    ctx.fillStyle="#111114";rr(ctx,m+70,py,300,84,42);ctx.fill();
    ctx.fillStyle="#FFFFFF";ctx.font='38px sans-serif';
    ctx.fillText("▶  "+fmtDur(audio.durationMs),m+115,py+56);
  }
  /* 标签 */
  ctx.font='34px sans-serif';ctx.fillStyle="#6B6B72";
  const tags=(n.pickedTags&&n.pickedTags.length?n.pickedTags:n.candTags||[]).map(t=>"#"+t).join("  ");
  ctx.fillText(tags,m+70,m+ch-80);
  /* 时间 + 类别 */
  ctx.fillStyle="#AEAEB6";ctx.font='32px sans-serif';
  ctx.fillText(fmtTime(n.createdAt)+" · "+(n.kind==="todo"?"✅ Todo":"✨ 灵感"),m+70,m+ch-24);
  /* 品牌 */
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.font='32px sans-serif';ctx.textAlign="right";
  ctx.fillText("Aha · 一声就记下",W-m,H-m+22);ctx.textAlign="left";
  $("#shareOv").classList.add("on");
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrapText(ctx,text,x,y,maxW,lh){
  let line="",yy=y;
  for(const ch of text){
    if(ch==="\n"||ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,yy);line=ch==="\n"?"":ch;yy+=lh}
    else line+=ch;
  }
  if(line)ctx.fillText(line,x,yy);
}

  const a=document.createElement("a");
  a.download="aha-"+new Date().toISOString().slice(0,10)+".png";

  let notes=[...S.notes].sort((a,b)=>b.createdAt-a.createdAt);
  if(libFilter!=="all")notes=notes.filter(n=>n.kind===libFilter);
  $("#libList").innerHTML=notes.length?notes.map(n=>noteHTML(n,true)).join(""):
    '<div class="empty"><img src="assets/empty.png"><br>这个分类还没有内容</div>';
  bindLongPress($("#libList"));
  /* 更新 pill 计数 */
  $$("#pills .pill").forEach(p=>{
    const f=p.dataset.f;
    const c=f==="all"?S.notes.length:S.notes.filter(n=>n.kind===f).length;
    p.innerHTML=(f==="all"?"全部":f==="idea"?"✨ 灵感":"✅ Todo")+'<span class="n">'+c+"</span>";
    p.classList.toggle("on",f===libFilter);
  });
}

/* ============ 通用 ============ */
const GREETS=[[5,"早上好"],[11,"中午好"],[14,"下午好"],[18,"晚上好"],[24,"夜深了"]];
const SUBS=["一声就记下","剩下的它替你记住","想到了，说一声","Aha，然后就不会忘了"];
let subIdx=0;
function greet(){
  const h=new Date().getHours();
  const g=GREETS.reduce((acc,[limit,text])=>h<limit?acc||text:acc,null)||GREETS[0][1];
  $("#greetMain").textContent=g+"！";
  $("#greetSub").textContent=SUBS[subIdx%SUBS.length];
}
function shuffleGreet(){subIdx++;greet()}
function switchTab(v){
  $$(".view").forEach(x=>x.classList.remove("active"));
  $("#view-"+v).classList.add("active");
  $("#inputbar").style.visibility=v==="feed"?"visible":"hidden";
  if(v==="lib")renderLib();
}
function resetAll(){if(confirm("清空并恢复演示数据？")){localStorage.removeItem(LS_KEY);localStorage.removeItem("aha_draft2");load();renderFeed();renderLib();greet();toast("已重置")}}

/* ============ 启动 ============ */
load();greet();renderFeed();renderLib();
</script>
