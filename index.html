<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aha ·· 一声就记下</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;700;900&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<style>
  :root{
    --paper:#EFF0F4;      /* 底色 */
    --blue:#6192FC;       /* 亮蓝 */
    --navy:#11358B;       /* 深蓝 */
    --lime:#C7EF66;       /* 荧光绿 */
    --ink:#14161c;
    --sub:#6b7078;
    --card:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#e2e4ea;
    font-family:'Noto Sans SC',sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
  }

  /* ===== 手机外框 ===== */
  .phone{
    position:relative;
    width:min(392px,100vw); height:min(844px,100vh);
    background:var(--paper);
    border-radius:46px;
    border:4px solid var(--ink);
    box-shadow:0 30px 60px rgba(17,53,139,.16);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  @media (max-width:480px){
    body{padding:0}
    .phone{border-radius:0;border:none;height:100vh;box-shadow:none}
  }

  /* ===== 顶部：文件夹式切换卡（页面表面贯通路径 + 插入式小卡） ===== */
  .tabs{
    position:relative;z-index:20;
    height:104px;flex:0 0 auto;
    display:flex;
    overflow:hidden;              /* 裁掉表面阴影溢出，保证下边缘干净 */
    margin-bottom:-1px;
  }
  /* 最底层：渐变浅灰蓝底色填充 */
  .tabs::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(180deg,#e6ebf4 0%,#d4dcea 100%);
  }
  /* 中层：未选中的插入式小卡（上边缘带阴影） */
  .tab-layer{
    position:absolute;inset:0;z-index:1;
    width:100%;height:100%;display:block;
    filter:drop-shadow(0 -2px 3px rgba(17,53,139,.28));
    pointer-events:none;
  }
  /* 上层：页面表面（选中卡 + 下方页面连成一体的整条轮廓） */
  .surface{
    position:absolute;inset:0;z-index:5;
    width:100%;height:100%;display:block;
    pointer-events:none;
  }
  .tabs.sel-capture .surface{filter:drop-shadow(5px 2px 5px rgba(17,53,139,.38))}
  .tabs.sel-history .surface{filter:drop-shadow(-5px 2px 5px rgba(17,53,139,.38))}
  /* 形态显隐 */
  .surf-left,.surf-right,.card-left,.card-right{display:none}
  .tabs.sel-capture .surf-left,
  .tabs.sel-capture .card-right,
  .tabs.sel-history .surf-right,
  .tabs.sel-history .card-left{display:block}
  /* 点击区 + 文字 */
  .tab{
    position:relative;z-index:10;
    flex:1;height:100%;
    cursor:pointer;
    outline:none;border:none;background:transparent;padding:0;
  }
  .tab span{
    position:absolute;left:50%;top:23px;transform:translateX(-50%);
    font-family:'Noto Sans SC',sans-serif;
    font-weight:700;font-size:15px;letter-spacing:2px;
    color:var(--sub);white-space:nowrap;
    transition:color .25s, top .25s;
    pointer-events:none;
  }
  .tab:not(.active) span{top:31px;color:#f2f5fa}
  .tab.active span{color:var(--ink)}

  /* ===== 主体（接续 surface 的同一段渐变，无缝过渡到页面底色） ===== */
  main{
    flex:1;display:flex;flex-direction:column;min-height:0;position:relative;
    background:linear-gradient(180deg,#dae1ee 0%, #EFF0F4 126px);
  }

  /* Logo + Slogan：logo 上移完全露出，slogan 轻体简约 */
  .brand{
    flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px 0 0;
  }
  .brand img{
    width:86px;height:86px;object-fit:contain;
    animation:logoPop .7s cubic-bezier(.34,1.5,.5,1) both .15s;
  }
  @keyframes logoPop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .slogan{
    margin-top:2px;
    display:flex;align-items:baseline;justify-content:center;gap:7px;
    color:var(--ink);
    animation:fadeUp .6s ease both .35s;
  }
  .slogan .aha{font-weight:900;font-size:22px;letter-spacing:1px}
  .slogan .hand{font-weight:300;font-size:16px;letter-spacing:3px;color:#3a3f48}
  @keyframes fadeUp{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

  /* ===== 视图 ===== */
  .view{flex:1;min-height:0;display:flex;flex-direction:column;animation:viewIn .35s ease both}
  .view[hidden]{display:none!important}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ===== 扇形循环轮播 ===== */
  .carousel{
    flex:1;min-height:0;
    position:relative;
    padding-top:26px; /* 卡片位置 */
    touch-action:pan-y;
    cursor:grab;
  }
  .carousel.dragging{cursor:grabbing}
  .c-card{
    position:absolute;left:50%;top:50%;
    width:216px;height:288px;
    margin:-137px 0 0 -108px; /* 负值增大 3px → 卡片整体上移 */
    background:var(--card);
    border-radius:20px;
    border:2.75px solid var(--ring,#AEC7FD); /* 色卡浅一度描边 */
    box-shadow:0 14px 30px rgba(17,53,139,.14), 0 3px 8px rgba(17,53,139,.08);
    padding:18px 16px 12px;
    display:flex;flex-direction:column;
    user-select:none;
    transition:transform .45s cubic-bezier(.3,1.1,.4,1), opacity .45s, box-shadow .45s;
    overflow:hidden;
    will-change:transform;
  }
  .carousel.dragging .c-card{transition:none}

  .q-open,.q-close{
    font-family:Georgia,serif;font-size:34px;line-height:1;
    color:rgba(17,53,139,.16);pointer-events:none;
  }
  .q-open{align-self:flex-start;margin:-6px 0 2px -2px}
  .q-close{position:absolute;right:14px;bottom:78px}

  .c-card h3{
    font-size:16px;font-weight:900;color:var(--ink);
    line-height:1.5;letter-spacing:.3px;
    margin:2px 0 8px;
  }
  .summary{
    position:relative;flex:1;min-height:0;overflow:hidden;
    font-size:12px;line-height:1.7;color:var(--sub);
  }
  .summary::after{ /* 摘要底部渐变遮罩 */
    content:"";position:absolute;left:0;right:0;bottom:0;height:55%;
    background:linear-gradient(to bottom, transparent, var(--card) 85%);
    pointer-events:none;
  }
  .summary img{
    width:100%;height:100%;object-fit:cover;
    border-radius:12px;
  }
  .card-foot{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    margin-top:10px;
  }
  .time{font-size:11px;color:var(--sub);letter-spacing:.3px}
  .chip{
    font-size:10.5px;font-weight:700;
    padding:2.5px 10px;border-radius:999px;
    background:rgba(97,146,252,.14);color:var(--navy);
  }
  .chip.todo{background:var(--lime);color:var(--ink)}
  .play{
    margin-left:auto;
    width:34px;height:34px;border-radius:50%;
    background:var(--navy);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .18s;
    flex:0 0 auto;
  }
  .play:hover{transform:scale(1.1)}
  .play:active{transform:scale(.92)}
  .play svg{width:12px;height:12px;fill:#fff;margin-left:1.5px}

  /* 轮播提示点 */
  .dots{
    flex:0 0 auto;display:flex;justify-content:center;gap:6px;
    padding:2px 0 10px;
  }
  .dots i{
    width:5px;height:5px;border-radius:50%;
    background:rgba(17,53,139,.22);
    transition:.3s;
  }
  .dots i.on{background:var(--blue);transform:scale(1.35)}

  /* ===== 往期记录：可滑动周视图 + 单日便签 + 项目收纳 ===== */
  #view-history{overflow:hidden}
  .history{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding:8px 18px 26px;scrollbar-width:none;
  }
  .history::-webkit-scrollbar{display:none}
  .week-panel{
    border-radius:17px;padding:10px 9px 9px;margin-bottom:12px;
    background:rgba(255,255,255,.84);
    box-shadow:0 8px 22px rgba(17,53,139,.10),inset 0 1px 0 rgba(255,255,255,.95);
    touch-action:pan-y;user-select:none;
  }
  .week-top{display:flex;align-items:center;padding:0 3px 8px 4px}
  .week-caption{flex:1;min-width:0}
  .week-caption strong{display:block;font-size:11px;line-height:1.1;color:var(--ink);letter-spacing:.5px}
  .week-caption span{display:block;margin-top:3px;font-size:8.5px;color:var(--sub);letter-spacing:.25px}
  .week-strip{display:grid;grid-template-columns:minmax(0,1fr) 29px;gap:5px;align-items:center}
  .calendar-btn{
    width:29px;height:29px;border-radius:9px;
    border:none;background:rgba(97,146,252,.14);color:var(--navy);
    display:grid;place-items:center;cursor:pointer;transition:.2s;
    align-self:center;
  }
  .calendar-btn:hover{background:rgba(97,146,252,.24);transform:translateY(-1px)}
  .calendar-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;min-width:0}
  .week-day{
    position:relative;border:none;border-radius:11px;background:transparent;
    min-width:0;padding:5px 1px 6px;cursor:pointer;color:var(--sub);
    transition:transform .2s,background .2s,color .2s,box-shadow .2s;
  }
  .week-day:hover{background:rgba(97,146,252,.09)}
  .week-day .wd{display:block;font-size:8px;line-height:1;margin-bottom:5px}
  .week-day .dn{display:block;font-size:11px;line-height:1;font-weight:800;color:var(--ink)}
  .week-day.has-note::after{content:"";position:absolute;left:50%;bottom:2px;width:3px;height:3px;border-radius:50%;background:var(--lime);transform:translateX(-50%)}
  .week-day.selected{
    color:#fff;background:var(--navy);transform:translateY(-1px);
    box-shadow:0 6px 12px rgba(17,53,139,.25);
  }
  .week-day.selected .dn{color:#fff}
  .week-day.selected::after{background:var(--lime)}
  .week-panel.slide-left{animation:weekLeft .26s ease}
  .week-panel.slide-right{animation:weekRight .26s ease}
  @keyframes weekLeft{50%{transform:translateX(-8px);opacity:.65}}
  @keyframes weekRight{50%{transform:translateX(8px);opacity:.65}}

  .day-section{margin-bottom:14px}
  .section-label{display:flex;align-items:baseline;gap:7px;padding:0 3px 8px}
  .section-label b{font-size:12px;color:var(--ink);font-weight:900}
  .section-label span{font-size:9px;color:var(--sub)}
  .day-note-list{display:grid;gap:7px}
  .day-note{
    position:relative;display:block;width:100%;text-align:left;border:none;cursor:pointer;
    border-radius:15px;padding:10px 38px 10px 13px;
    background:rgba(255,255,255,.84);
    box-shadow:0 7px 16px rgba(17,53,139,.09),inset 0 1px 0 #fff;
    animation:noteIn .35s ease both;
  }
  @keyframes noteIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .day-note::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 5px 5px 0;background:var(--accent)}
  .day-note b{display:block;font-size:11px;line-height:1.4;color:var(--ink);font-weight:700}
  .day-note span{display:block;margin-top:4px;font-size:8.5px;color:var(--sub)}
  .day-note .note-arrow{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:15px;color:rgba(17,53,139,.36)}
  .day-empty{
    border-radius:15px;padding:14px;text-align:center;font-size:10px;color:var(--sub);
    background:rgba(255,255,255,.48);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)
  }

  .projects-head{display:flex;align-items:baseline;gap:7px;padding:2px 3px 9px}
  .projects-head b{font-size:12px;color:var(--ink);font-weight:900}
  .projects-head span{font-size:9px;color:var(--sub)}
  .history-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;padding:0 2px 10px}
  .history-col{display:grid;gap:12px}
  /* 项目卡：纯色块 + 右侧边缘凹口 + 右下角内凹缺口（参考图形态） */
  .archive-group{
    position:relative;height:180px;cursor:pointer;border:none;padding:0;
    background:transparent;overflow:visible;
    filter:drop-shadow(0 14px 22px rgba(17,53,139,.20)) drop-shadow(0 5px 8px rgba(17,53,139,.10));
    animation:groupIn .45s cubic-bezier(.2,.85,.3,1) both;
    transition:transform .22s,filter .22s;
  }
  .archive-group:hover{transform:translateY(-4px);filter:drop-shadow(0 20px 30px rgba(17,53,139,.24)) drop-shadow(0 7px 11px rgba(17,53,139,.12))}
  @keyframes groupIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  /* 卡体：SVG 路径裁出上圆角 + 右侧凹口 + 右下缺口 */
  .group-shape{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
  .group-body{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;
    padding:11px 12px 13px;
  }
  /* 左上分类图标（白色圆角方块） */
  .group-icon{
    width:31px;height:31px;border-radius:11px;background:rgba(255,255,255,.30);
    display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;
    backdrop-filter:blur(2px);
  }
  .archive-group.light .group-icon{background:rgba(20,22,28,.10);color:var(--ink)}
  /* 右上角：最近更新日期 */
  .group-count{
    position:absolute;right:11px;top:11px;z-index:3;
    height:26px;padding:0 9px;border-radius:9px;
    background:rgba(255,255,255,.26);color:#fff;
    display:grid;place-items:center;font-size:10px;font-weight:900;letter-spacing:.3px;
    white-space:nowrap;
  }
  .archive-group.light .group-count{background:rgba(20,22,28,.09);color:var(--ink)}
  /* 右侧凹口里的箭头 */
  .project-open{
    position:absolute;right:2px;top:70px;z-index:4;
    width:16px;height:16px;color:var(--accent);
    display:grid;place-items:center;font-size:13px;font-style:normal;font-weight:900;
  }
  /* 右下缺口里的铅笔 */
  .project-pen{
    position:absolute;right:11px;bottom:10px;z-index:4;
    font-size:11px;font-style:normal;color:var(--accent);opacity:.62;
  }
  .archive-group.light .project-pen{color:var(--ink);opacity:.42}
  /* 大标题压在底部信息上方 */
  .group-title{
    margin-top:auto;
    font-size:16px;font-weight:900;letter-spacing:.2px;line-height:1.1;
    color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding-right:30px;
  }
  .archive-group.light .group-title{color:var(--ink)}
  /* 便签横条摘要（1-2 条），下方渐隐 */
  .note-list{
    position:relative;margin-top:6px;
    max-height:30px;overflow:hidden;
    padding-right:36px;
  }
  .note-list::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:19px;
    background:linear-gradient(to bottom,transparent,var(--group-bg) 88%);
    pointer-events:none;
  }
  .note-chip{
    display:block;width:100%;text-align:left;border:none;background:none;
    padding:0 0 3px;margin:0;cursor:pointer;color:inherit;
    font-size:10px;line-height:1.35;font-weight:700;
    color:rgba(255,255,255,.92);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .archive-group.light .note-chip{color:rgba(20,22,28,.82)}
  /* 底部：最后编辑时间 */
  .group-edited{
    margin-top:4px;font-size:9px;letter-spacing:.2px;
    color:rgba(255,255,255,.74);padding-right:30px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .archive-group.light .group-edited{color:rgba(20,22,28,.52)}

  /* ===== 二级页面：项目详情 / 便签详情 ===== */
  .detail-view{overflow:hidden}
  .detail-top{
    flex:0 0 auto;display:flex;align-items:center;gap:9px;
    padding:6px 18px 10px;
  }
  .back-btn{
    flex:0 0 auto;width:30px;height:30px;border-radius:10px;border:none;cursor:pointer;
    background:rgba(255,255,255,.86);color:var(--navy);
    font-size:19px;line-height:1;font-weight:900;
    display:grid;place-items:center;
    box-shadow:0 5px 12px rgba(17,53,139,.10);transition:.18s;
  }
  .back-btn:hover{transform:translateX(-2px);background:#fff}
  .detail-title{min-width:0}
  .detail-title b{display:block;font-size:14px;font-weight:900;color:var(--ink);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .detail-title span{display:block;margin-top:2px;font-size:9px;color:var(--sub)}
  .detail-scroll{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
    padding:2px 18px 26px;scrollbar-width:none;
  }
  .detail-scroll::-webkit-scrollbar{display:none}

  /* 项目详情：便签列表 */
  .project-notes{display:grid;gap:8px}
  .p-note{
    position:relative;display:block;width:100%;text-align:left;border:none;cursor:pointer;
    border-radius:16px;padding:11px 34px 11px 14px;
    background:rgba(255,255,255,.88);
    box-shadow:0 7px 16px rgba(17,53,139,.09),inset 0 1px 0 #fff;
    animation:noteIn .34s ease both;
  }
  .p-note::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:4px;border-radius:0 5px 5px 0;background:var(--accent)}
  .p-note b{display:block;font-size:11.5px;line-height:1.4;color:var(--ink);font-weight:700}
  .p-note span{display:block;margin-top:4px;font-size:8.5px;color:var(--sub)}
  .p-note i{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-style:normal;font-size:15px;color:rgba(17,53,139,.34)}

  /* 便签详情：展开动效 */
  @keyframes expandIn{
    from{opacity:0;transform:scale(.9) translateY(14px)}
    to{opacity:1;transform:none}
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  #view-note .note-hero{animation:expandIn .42s cubic-bezier(.2,.9,.3,1) both}
  #view-note .seg-head{animation:riseIn .4s ease both .12s}
  #view-note .seg-list{animation:riseIn .4s ease both .18s}
  #view-note .kw-block{animation:riseIn .4s ease both .26s}

  /* 顶部语音卡：形状与参考素材一致（顶边双圆凹口 + 白色内嵌条 + 底部胶囊&独立圆钮） */
  .note-hero{
    position:relative;height:192px;margin-top:22px;
    padding:0;border:none;background:transparent;overflow:visible;
    filter:drop-shadow(0 15px 26px rgba(17,53,139,.19)) drop-shadow(0 5px 9px rgba(17,53,139,.10));
  }
  .hero-shape{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
  /* 左上：白色内嵌信息条 */
  .hero-meta{
    position:absolute;left:14px;top:13px;z-index:2;
    display:flex;align-items:center;gap:8px;
    height:40px;padding:0 13px 0 6px;border-radius:14px;
    background:#fff;box-shadow:0 4px 10px rgba(17,53,139,.10);
  }
  .hero-meta .m-ico{
    width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
    background:var(--group-bg);color:var(--m-ico,#fff);font-size:13px;font-weight:900;
  }
  .hero-meta .m-txt{min-width:0}
  .hero-meta .m-txt b{display:block;font-size:10.5px;font-weight:900;color:var(--ink);line-height:1.1}
  .hero-meta .m-txt span{display:block;margin-top:2px;font-size:8px;color:var(--sub);line-height:1}
  /* 右上：嵌进凹口的两个圆钮（圆心落在卡片顶边上） */
  .hero-act{
    position:absolute;top:-17px;z-index:3;
    width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
    background:#fff;color:var(--navy);
    display:grid;place-items:center;font-size:14px;line-height:1;
    box-shadow:0 4px 9px rgba(17,53,139,.13);transition:.18s;
  }
  .hero-act:hover{transform:translateY(-2px)}
  .hero-act.a1{right:63px}
  .hero-act.a2{right:19px}
  .hero-act.on{background:var(--navy);color:#fff}
  /* 一句话标题 */
  .note-hero h3{
    position:absolute;left:17px;right:17px;top:72px;z-index:2;
    font-size:16px;font-weight:900;line-height:1.4;letter-spacing:.2px;
    color:#fff;
  }
  .note-hero.light h3{color:var(--ink)}
  /* 图片便签：卡内直接展示 */
  .hero-img{
    position:absolute;left:15px;right:15px;bottom:66px;z-index:2;
    height:84px;object-fit:cover;border-radius:13px;
    box-shadow:0 5px 12px rgba(17,53,139,.14);
  }
  /* 底部：白色波形胶囊 + 独立深色圆钮 */
  .voice-bar{
    position:absolute;left:14px;right:14px;bottom:13px;z-index:2;
    display:flex;align-items:center;gap:9px;
  }
  .wave-pill{
    flex:1;min-width:0;height:44px;border-radius:999px;
    display:flex;align-items:center;gap:10px;padding:0 15px;
    background:#fff;box-shadow:0 4px 11px rgba(17,53,139,.10);
  }
  .wave{flex:1;min-width:0;height:24px;display:flex;align-items:center;gap:2px;overflow:hidden}
  .wave i{
    flex:1;min-width:0;border-radius:2px;background:rgba(17,53,139,.24);
    height:var(--h,30%);transition:height .18s ease,background .18s;
  }
  .voice-bar.playing .wave i{background:var(--blue);animation:waveBeat .9s ease-in-out infinite}
  @keyframes waveBeat{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
  .voice-dur{flex:0 0 auto;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.3px;font-variant-numeric:tabular-nums}
  .voice-play{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:var(--navy);display:grid;place-items:center;transition:transform .16s;
    box-shadow:0 6px 14px rgba(17,53,139,.24);
  }
  .note-hero:not(.light) .voice-play{background:var(--lime)}
  .voice-play:hover{transform:scale(1.06)}
  .voice-play svg{width:13px;height:13px;fill:#fff;margin-left:2px}
  .note-hero:not(.light) .voice-play svg{fill:var(--navy)}
  .voice-play.playing svg{display:none}
  .voice-play.playing::before{content:"";width:11px;height:13px;border-left:3.5px solid #fff;border-right:3.5px solid #fff}
  .note-hero:not(.light) .voice-play.playing::before{border-color:var(--navy)}

  /* 分章节摘要 / 原文 */
  .seg-head{display:flex;align-items:center;margin:17px 2px 9px}
  .seg-head b{flex:1;font-size:12px;font-weight:900;color:var(--ink)}
  .seg-toggle{
    border:none;cursor:pointer;border-radius:999px;padding:4px 11px;
    background:rgba(17,53,139,.09);color:var(--navy);
    font-family:inherit;font-size:9.5px;font-weight:700;letter-spacing:.3px;transition:.18s;
  }
  .seg-toggle:hover{background:rgba(17,53,139,.16)}
  .seg-toggle.on{background:var(--navy);color:#fff}
  .seg-list{display:grid;gap:7px}
  .seg-item{
    position:relative;border-radius:15px;padding:10px 13px 10px 33px;
    background:rgba(255,255,255,.86);
    box-shadow:0 5px 13px rgba(17,53,139,.07),inset 0 1px 0 #fff;
  }
  .seg-no{
    position:absolute;left:11px;top:11px;
    width:15px;height:15px;border-radius:5px;background:rgba(97,146,252,.18);
    color:var(--navy);font-size:8px;font-weight:900;
    display:grid;place-items:center;
  }
  .seg-item p{font-size:11px;line-height:1.55;color:var(--ink);font-weight:700}
  /* 原文块：整段原始转录，宋体增强"原话"手记感 */
  .raw-block{
    border-radius:15px;padding:13px 14px 10px;
    background:rgba(255,255,255,.86);
    box-shadow:0 5px 13px rgba(17,53,139,.07),inset 0 1px 0 #fff;
    animation:riseIn .3s ease both;
  }
  .raw-text{
    font-family:'Noto Serif SC',Songti SC,serif;
    font-size:11.5px;line-height:1.95;color:#2f343d;letter-spacing:.35px;
    word-spacing:2px;
  }
  .raw-foot{
    display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;
    border-top:1px dashed rgba(17,53,139,.14);
    font-size:8px;color:var(--sub);letter-spacing:.3px;
  }
  /* AI 主标签（虚线待确认态 / 实线已确认态） */
  .tag-row{display:flex;align-items:center;gap:7px;margin:15px 2px 0;flex-wrap:wrap}
  .tag-row .t-label{font-size:9px;color:var(--sub);letter-spacing:.3px}
  .ai-tag{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10px;font-weight:800;letter-spacing:.2px;
    padding:5px 11px;border-radius:999px;
    background:rgba(97,146,252,.14);color:var(--navy);border:1.5px solid transparent;
  }
  .ai-tag.suggested{
    background:transparent;border:1.5px dashed rgba(17,53,139,.42);color:var(--navy);
  }
  .tag-confirm{
    display:flex;gap:5px;
  }
  .tag-confirm button{
    width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;
    display:grid;place-items:center;font-size:11px;line-height:1;transition:.18s;
  }
  .tag-yes{background:var(--lime);color:var(--ink)}
  .tag-no{background:rgba(17,53,139,.09);color:var(--sub)}
  .tag-confirm button:hover{transform:scale(1.12)}
  .tag-hint{font-size:8px;color:var(--sub);letter-spacing:.2px;width:100%;margin-top:2px}

  /* 关键词 */
  .kw-block{margin-top:17px}
  .kw-head{font-size:12px;font-weight:900;color:var(--ink);padding:0 2px 9px}
  .kw-list{display:flex;flex-wrap:wrap;gap:6px;padding:0 1px}
  .kw-list span{
    font-size:10px;font-weight:700;letter-spacing:.2px;
    padding:5px 11px;border-radius:999px;
    background:rgba(255,255,255,.88);color:var(--navy);
    box-shadow:0 4px 10px rgba(17,53,139,.08),inset 0 1px 0 #fff;
  }
  .kw-list span:nth-child(3n+2){background:var(--lime);color:var(--ink)}
  .kw-list span:nth-child(3n+3){background:rgba(97,146,252,.17)}

  /* 底部操作：分享（自传播引擎） */
  .note-ops{display:flex;gap:8px;margin-top:19px;animation:riseIn .4s ease both .32s}
  .op-btn{
    flex:1;height:42px;border:none;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.88);color:var(--ink);
    font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.3px;
    display:flex;align-items:center;justify-content:center;gap:6px;
    box-shadow:0 5px 13px rgba(17,53,139,.09),inset 0 1px 0 #fff;transition:.18s;
  }
  .op-btn:hover{transform:translateY(-2px);box-shadow:0 8px 17px rgba(17,53,139,.13)}
  .op-btn .op-i{font-size:13px;color:var(--navy);display:grid;place-items:center}
  .op-btn .op-i svg{width:15px;height:15px}
  .op-btn.wide{height:46px;font-size:12px}

  /* ===== 分享界面 ===== */
  .share-stage{
    display:grid;place-items:center;padding:6px 0 4px;
    animation:expandIn .4s cubic-bezier(.2,.9,.3,1) both;
  }
  .share-canvas{
    width:auto;height:auto;max-width:212px;max-height:300px;
    border-radius:18px;display:block;
    box-shadow:0 16px 34px rgba(17,53,139,.20),0 5px 10px rgba(17,53,139,.10);
  }
  .share-styles{
    display:flex;justify-content:center;gap:9px;margin:15px 0 4px;
    animation:riseIn .38s ease both .1s;
  }
  .share-styles button{
    width:30px;height:30px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;
    transition:.18s;box-shadow:0 3px 8px rgba(17,53,139,.12);
  }
  .share-styles button.on{border-color:var(--navy);transform:scale(1.12)}
  .share-opts{
    display:flex;flex-direction:column;gap:7px;margin:15px 3px 0;
    animation:riseIn .38s ease both .16s;
  }
  .share-opt{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--ink);cursor:pointer}
  .share-opt input{width:15px;height:15px;accent-color:var(--navy);cursor:pointer}
  .share-acts{display:flex;gap:8px;margin-top:17px;animation:riseIn .38s ease both .22s}
  .share-act{
    flex:1;height:46px;border:none;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.9);color:var(--ink);
    font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.4px;
    box-shadow:0 5px 13px rgba(17,53,139,.09),inset 0 1px 0 #fff;transition:.18s;
  }
  .share-act:hover{transform:translateY(-2px)}
  .share-act.primary{background:var(--navy);color:#fff;box-shadow:0 7px 16px rgba(17,53,139,.26)}
  .share-note{margin-top:11px;text-align:center;font-size:9px;color:var(--sub);letter-spacing:.3px}

  /* ===== 上传录音/图片：上拉选项面板 ===== */
  .sheet-mask{
    position:absolute;inset:0;z-index:48;background:rgba(17,25,48,.30);
    opacity:0;pointer-events:none;transition:.24s;
  }
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .up-sheet{
    position:absolute;left:10px;right:10px;bottom:10px;z-index:49;
    border-radius:24px;padding:8px;
    background:rgba(255,255,255,.97);
    box-shadow:0 -8px 34px rgba(17,53,139,.22);
    transform:translateY(112%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
  }
  .up-sheet.show{transform:none}
  .up-title{text-align:center;font-size:10px;color:var(--sub);padding:6px 0 10px;letter-spacing:.4px}
  .up-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .up-item{
    border:none;cursor:pointer;border-radius:18px;padding:16px 10px 14px;
    background:rgba(97,146,252,.10);
    display:flex;flex-direction:column;align-items:center;gap:8px;
    font-family:inherit;font-size:11.5px;font-weight:800;color:var(--ink);transition:.18s;
  }
  .up-item:hover{background:rgba(97,146,252,.19);transform:translateY(-2px)}
  .up-item .u-ico{
    width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
    background:#fff;box-shadow:0 4px 10px rgba(17,53,139,.12);
  }
  .up-item .u-ico svg{width:21px;height:21px;stroke:var(--navy);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .up-item.lime .u-ico{background:var(--lime)}
  .up-item small{font-size:8.5px;font-weight:400;color:var(--sub);letter-spacing:.2px}
  .up-cancel{
    width:100%;margin-top:8px;height:44px;border:none;border-radius:16px;cursor:pointer;
    background:rgba(17,53,139,.06);color:var(--ink);
    font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.5px;
  }

  /* 日历浮层 */
  .calendar-pop{
    position:absolute;z-index:60;top:115px;right:18px;width:252px;
    border-radius:20px;padding:15px;
    background:rgba(255,255,255,.97);
    border:1px solid rgba(17,53,139,.13);
    box-shadow:0 18px 42px rgba(17,53,139,.22);
    transform-origin:top right;animation:calIn .2s ease both;
  }
  .calendar-pop[hidden]{display:none}
  @keyframes calIn{from{opacity:0;transform:scale(.94) translateY(-5px)}to{opacity:1;transform:none}}
  .cal-head{display:flex;align-items:center;margin-bottom:11px}
  .cal-head strong{flex:1;font-size:13px;color:var(--ink);text-align:center}
  .cal-close{border:none;background:none;color:var(--sub);font-size:18px;cursor:pointer}
  .cal-nav{
    width:22px;height:22px;border:none;border-radius:7px;cursor:pointer;
    background:rgba(97,146,252,.13);color:var(--navy);
    font-size:14px;line-height:1;display:grid;place-items:center;transition:.18s;
  }
  .cal-nav:hover{background:rgba(97,146,252,.24)}
  .cal-week,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .cal-week span{font-size:9px;color:var(--sub);padding-bottom:3px}
  .cal-day{
    aspect-ratio:1;border:none;border-radius:9px;background:transparent;
    color:var(--ink);font-size:10px;cursor:pointer
  }
  .cal-day:hover{background:rgba(97,146,252,.13)}
  .cal-day.has-note{font-weight:900;color:var(--navy);box-shadow:inset 0 -2px 0 var(--lime)}
  .cal-day.selected{background:var(--navy);color:#fff;box-shadow:none}
  .cal-day.muted{color:#c2c6cf;cursor:default}
  .dock[hidden]{display:none}

  /* ===== 底部操作栏（细描边） ===== */
  .dock{
    flex:0 0 auto;z-index:20;
    display:flex;align-items:center;gap:12px;
    padding:14px 22px 26px;
    background:var(--paper);
  }
  .kbd{
    flex:0 0 auto;
    width:50px;height:50px;border-radius:50%;
    background:#fff;
    border:1.2px solid rgba(20,22,28,.55);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 5px 14px rgba(17,53,139,.14), 0 2px 4px rgba(17,53,139,.08);
    transition:transform .15s, box-shadow .15s;
  }
  .kbd:active{transform:translateY(2px);box-shadow:0 2px 6px rgba(17,53,139,.14)}
  .kbd svg{width:23px;height:23px;stroke:var(--ink)}
  .kbd[hidden]{display:none}
  .talk{
    flex:1;height:56px;
    border-radius:999px;
    border:1.2px solid rgba(20,22,28,.55);
    background:#fff;
    font-family:'Noto Sans SC',sans-serif;
    font-weight:700;font-size:17px;letter-spacing:6px;color:var(--ink);
    cursor:pointer;
    box-shadow:0 6px 16px rgba(17,53,139,.14), 0 2px 5px rgba(17,53,139,.08);
    transition:transform .15s, box-shadow .15s, background .2s;
    position:relative;overflow:visible;
  }
  .talk.holding{
    background:var(--blue);color:#fff;border-color:var(--navy);
    transform:translateY(2px);
    box-shadow:0 3px 10px rgba(17,53,139,.20);
  }
  .talk.holding::before,.talk.holding::after{
    content:"";position:absolute;inset:-1.2px;border-radius:999px;
    border:1.2px solid var(--blue);
    animation:ripple 1.2s ease-out infinite;
  }
  .talk.holding::after{animation-delay:.6s}
  @keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(1.22,1.55);opacity:0}}

  /* 记录成功浮层 */
  .toast{
    position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(12px);
    z-index:40;
    background:var(--navy);color:#fff;
    font-size:13px;font-weight:700;letter-spacing:2px;
    padding:9px 20px;border-radius:999px;
    opacity:0;pointer-events:none;
    transition:.3s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 处理中状态条（转写/生成卡片时） */
  .busy-bar{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:70;display:flex;align-items:center;gap:9px;
    padding:12px 18px;border-radius:999px;
    background:rgba(20,22,28,.9);color:#fff;
    font-size:11px;font-weight:700;letter-spacing:.5px;
    box-shadow:0 12px 28px rgba(17,53,139,.3);
  }
  .busy-bar[hidden]{display:none}
  .busy-bar .spin{
    width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,255,255,.28);border-top-color:#C7EF66;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 上滑取消区（微信语音同款心智） */
  .cancel-zone{
    position:absolute;left:50%;bottom:112px;transform:translateX(-50%) scale(.85);
    z-index:38;display:flex;flex-direction:column;align-items:center;gap:5px;
    opacity:0;pointer-events:none;transition:.22s;
  }
  .cancel-zone.show{opacity:1;transform:translateX(-50%) scale(1)}
  .cancel-zone .cz-ico{
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.92);color:var(--sub);
    display:grid;place-items:center;font-size:15px;
    box-shadow:0 6px 15px rgba(17,53,139,.14);transition:.2s;
  }
  .cancel-zone .cz-txt{font-size:9px;color:var(--sub);letter-spacing:.5px}
  .cancel-zone.armed .cz-ico{background:#e4574c;color:#fff;transform:scale(1.14)}
  .cancel-zone.armed .cz-txt{color:#e4574c;font-weight:800}
  /* 长录提示条 */
  .rec-tip{
    position:absolute;left:50%;top:112px;transform:translateX(-50%) translateY(-8px);
    z-index:38;max-width:78%;
    background:rgba(20,22,28,.86);color:#fff;
    font-size:10px;letter-spacing:.3px;
    padding:7px 14px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.25s;
  }
  .rec-tip.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 录音态：接近上限变色 / 上滑取消态 */
  .talk.to-cancel{background:#e4574c;color:#fff;border-color:#c8433a}
  .talk.to-cancel::before,.talk.to-cancel::after{border-color:#e4574c}
  .talk.near-limit{background:#f0a63c;color:#fff;border-color:#d18b26;letter-spacing:1px}
  .talk.near-limit::before,.talk.near-limit::after{border-color:#f0a63c}
</style>
</head>
<body>
<div class="phone">

  <!-- 顶部文件夹式切换卡：页面表面为一条贯通路径（所有转角统一 r=8），未选中卡插在下方图层 -->
  <nav class="tabs sel-capture">
    <!-- 中层：未选中的插入式小卡（左边缘藏在斜边之后＝真正的插入关系） -->
    <svg class="tab-layer" viewBox="0 0 384 104" preserveAspectRatio="none">
      <defs>
        <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#97a6c2"/>
          <stop offset="1" stop-color="#b0bcd4"/>
        </linearGradient>
      </defs>
      <path class="card-right" fill="url(#cardGrad)"
            d="M150 104 L150 30 Q150 22, 158 22 L400 22 L400 104 Z"/>
      <path class="card-left" fill="url(#cardGrad)"
            d="M234 104 L234 30 Q234 22, 226 22 L-16 22 L-16 104 Z"/>
    </svg>
    <!-- 上层：页面表面（选中卡与下方页面连成一体的整条轮廓，圆角全部 r=8） -->
    <svg class="surface" viewBox="0 0 384 104" preserveAspectRatio="none">
      <defs>
        <linearGradient id="surfGrad" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="230">
          <stop offset="0" stop-color="#c9d4ea"/>
          <stop offset="1" stop-color="#EFF0F4"/>
        </linearGradient>
      </defs>
      <path class="surf-left" fill="url(#surfGrad)"
            d="M0 12 L172 12 Q180 12, 184 19.6 L198 52.4 Q202 60, 210 60 L384 60 L384 104 L0 104 Z"/>
      <path class="surf-right" fill="url(#surfGrad)"
            d="M384 12 L212 12 Q204 12, 200 19.6 L186 52.4 Q182 60, 174 60 L0 60 L0 104 L384 104 Z"/>
    </svg>
    <button class="tab tab-capture active" data-view="capture"><span>记住灵感</span></button>
    <button class="tab tab-history" data-view="history"><span>往期记录</span></button>
  </nav>

  <main>
    <!-- 记住灵感：Logo + Slogan + 扇形循环轮播 -->
    <section class="view" id="view-capture">
      <div class="brand">
        <img src="assets/logo.png" alt="Aha logo">
        <p class="slogan"><span class="aha">Aha</span><span class="hand">·一声就记下</span></p>
      </div>
      <div class="carousel" id="carousel"></div>
      <div class="dots" id="dots"></div>
    </section>

    <!-- 往期记录（滑动周历 + 单日便签 + 项目双列收纳） -->
    <section class="view" id="view-history" hidden>
      <div class="history">
        <div class="week-panel" id="weekPanel">
          <div class="week-top">
            <div class="week-caption"><strong id="weekTitle">本周</strong><span id="weekRange">8月24日 — 8月30日 · 左右滑动切换周</span></div>
          </div>
          <div class="week-strip">
            <div class="week-days" id="weekDays"></div>
            <button class="calendar-btn" id="calendarBtn" aria-label="打开日历">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
            </button>
          </div>
        </div>

        <section class="day-section">
          <div class="section-label"><b id="dayTitle">8月30日 · 周日</b><span id="dayCount">1 条便签</span></div>
          <div class="day-note-list" id="dayNoteList"></div>
        </section>

        <div class="projects-head"><b>按项目 / 标签</b><span>上下滑动查看全部</span></div>
        <div class="history-grid" id="historyGrid"></div>
      </div>
    </section>

    <!-- 项目详情：该项目全部便利贴 -->

/* ---------- 扇形循环轮播 ---------- */
const carousel=document.getElementById('carousel');
const dotsBox=document.getElementById('dots');
let N=CARDS.length;        // 新增便签后会变化
let cur=0;                 // 连续索引（可为任意整数，取模得当前卡）
const STEP=132;            // 相邻卡片水平间距

// 建卡（新便签生成后可整体重建）
let cardEls=[],dots=[];
function buildCarousel(){
  carousel.innerHTML='';
  CARDS.forEach((c,i)=>{
    const el=document.createElement('article');
    el.className='c-card';
    el.style.setProperty('--ring',c.ring);
    el.innerHTML=`
      <span class="q-open">“</span>
      <h3>${c.title}</h3>
      <div class="summary">${c.img?`<img src="${c.img}" alt="">`:c.text}</div>
      ${c.img?'':'<span class="q-close">”</span>'}
      <div class="card-foot">
        <span class="time">${c.time}</span>
        <span class="chip ${c.tagCls||''}">${c.tag}</span>
        <button class="play" aria-label="播放语音">
          <svg viewBox="0 0 24 24"><path d="M6 4.5v15l13-7.5z"/></svg>
        </button>
      </div>`;
    carousel.appendChild(el);
  });
  dotsBox.innerHTML=CARDS.map(()=>'<i></i>').join('');
  dots=[...dotsBox.children];
  cardEls=[...carousel.children];
  N=CARDS.length;
  bindCards();
}
buildCarousel();

// 最短循环距离：d ∈ (-N/2, N/2]
function circ(d){ d%=N; if(d>N/2)d-=N; if(d<=-N/2)d+=N; return d; }

function layout(offset=0){  // offset: 拖拽中的连续位移（卡片单位）
  const pos=cur+offset;
  cardEls.forEach((el,i)=>{
    const d=circ(i-pos);                 // 相对中轴的位置
    const ad=Math.abs(d);
    const x=d*STEP;
    const rot=CARDS[i].rot + d*4;        // 每张固有倾角 + 轴线上递增
    const scale=Math.max(.72, 1-ad*.13); // 中轴上的最大
    const y=ad*ad*10;                    // 两端微微下沉，形成弧线
    el.style.transform=`translateX(${x}px) translateY(${y}px) rotate(${rot}deg) scale(${scale})`;
    el.style.zIndex=String(100-Math.round(ad*10));
    el.style.opacity=ad>1.6?'0':String(1-ad*.28);
    el.style.pointerEvents=ad<.5?'auto':'none';
  });
  const idx=((Math.round(pos)%N)+N)%N;
  dots.forEach((dt,i)=>dt.classList.toggle('on',i===idx));
}
layout();

/* 拖拽 / 滑动 */
let sx=0,drag=false,off=0;
carousel.addEventListener('pointerdown',e=>{
  if(e.target.closest('.play'))return;
  drag=true;sx=e.clientX;off=0;
  carousel.classList.add('dragging');
  carousel.setPointerCapture(e.pointerId);
});
carousel.addEventListener('pointermove',e=>{
  if(!drag)return;
  off=(e.clientX-sx)/STEP;      // 向右拖 → 看左边卡片
  layout(-off);
});
function endDrag(){
  if(!drag)return;drag=false;
  carousel.classList.remove('dragging');
  const steps=Math.round(off);
  cur-=steps;                   // 连续索引，天然循环
  layout();
}
carousel.addEventListener('pointerup',endDrag);
carousel.addEventListener('pointercancel',endDrag);
/* 点中轴卡片 → 进入便签详情（拖拽后不触发） */
function bindCards(){
  cardEls.forEach((el,i)=>el.addEventListener('click',e=>{
    if(e.target.closest('.play')||Math.abs(off)>.12)return;
    const c=CARDS[i];
    openNote(c.key,'capture');
  }));
}

const WEEK_NAMES=['周一','周二','周三','周四','周五','周六','周日'];
/* 统一按北京时间取「今天」，不依赖本机时区 */
function bjNow(){
  const parts=Object.fromEntries(
    new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
    .formatToParts(new Date()).map(p=>[p.type,p.value]));
  return {date:`${parts.year}-${parts.month}-${parts.day}`,time:`${parts.hour}:${parts.minute}`};
}
function bjToday(){return bjNow().date}
const TODAY=bjToday();                    // 北京时间今天
const BASE_WEEK=TODAY;                    // "本周" 以今天为基准
let selectedDate=TODAY;
let weekAnchor=parseISO(selectedDate);
let calMonth=(()=>{const [y,m]=TODAY.split('-').map(Number);return new Date(y,m-1,1)})();

function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function sameDay(a,b){return isoDate(a)===isoDate(b)}
function fmtShort(d){return `${d.getMonth()+1}月${d.getDate()}日`}

function groupCard(name,items,index){
  const g=GROUPS[name];
  const sorted=[...items].sort((a,b)=>b.date.localeCompare(a.date));
  const recent=sorted.slice(0,2);
  const gi=name;
  const last=sorted[0];                                   // 最后编辑的一条
  const lastDate=parseISO(last.date);
  const badge=`${lastDate.getMonth()+1}/${lastDate.getDate()}`;   // 右上角日期
  const lastTime=last.time.replace(/^.*?\s(?=\d{1,2}:\d{2}$)/,'');
  // 卡形（参考图）：常规圆角 + 右侧中部内凹口（箭头位）+ 右下角超大圆角缺口（铅笔位）
  const shape=
    'M22 0 H150 A22 22 0 0 1 172 22 '+
    'V58 C172 71, 149 67, 149 80 C149 93, 172 89, 172 102 '+   // 右侧凹口
    'V136 C172 170, 150 194, 116 194 '+                         // 右下大圆角缺口
    'H22 A22 22 0 0 1 0 172 V22 A22 22 0 0 1 22 0 Z';
  return `<section class="archive-group ${g.light?'light':''}" data-group="${gi}" style="--group-bg:${g.bg};--accent:${g.accent};animation-delay:${index*55}ms">
    <svg class="group-shape" viewBox="0 0 172 194" preserveAspectRatio="none" shape-rendering="geometricPrecision"><path d="${shape}" fill="${g.bg}"/></svg>
    <span class="group-count">${badge}</span>
    <i class="project-open">↗</i>
    <i class="project-pen">✎</i>
    <div class="group-body">
      <span class="group-icon">${g.icon}</span>
      <b class="group-title">${name}</b>
      <div class="note-list">${recent.map(n=>`<button class="note-chip">${n.t}</button>`).join('')}</div>
      <div class="group-edited">${last.time}</div>
    </div>
  </section>`;
}
function renderProjects(){
  const groups=HISTORY.reduce((a,x)=>((a[x.group]??=[]).push(x),a),{});
  const left=['空间实验','学习笔记'].filter(x=>groups[x]);
  const right=['生活灵感','待办事项'].filter(x=>groups[x]);
  historyGrid.innerHTML=`<div class="history-col">${left.map((n,i)=>groupCard(n,groups[n],i)).join('')}</div><div class="history-col">${right.map((n,i)=>groupCard(n,groups[n],i+left.length)).join('')}</div>`;
  historyGrid.querySelectorAll('.archive-group').forEach(el=>{
    el.addEventListener('click',()=>openProject(el.dataset.group));
  });
}
function renderDay(date){
  selectedDate=date;
  const dt=parseISO(date);
  const rows=HISTORY.filter(x=>x.date===date);
  const weekday=WEEK_NAMES[(dt.getDay()+6)%7];
  dayTitle.textContent=`${fmtShort(dt)} · ${weekday}`;
  dayCount.textContent=`${rows.length} 条便签`;
  dayNoteList.innerHTML=rows.length?rows.map((n,i)=>{

  }).join(''):'<div class="day-empty">这一天还没有便利贴，留一点空白也很好。</div>';
  dayNoteList.querySelectorAll('.day-note').forEach(el=>{
    el.addEventListener('click',()=>openNote(el.dataset.key,'history'));
  });
  renderWeek();

function renderWeek(){
  const start=mondayOf(weekAnchor);
  const end=addDays(start,6);
  const base=mondayOf(parseISO(BASE_WEEK));
  const delta=Math.round((start-base)/86400000/7);
  weekTitle.textContent=delta===0?'本周':delta<0?`${Math.abs(delta)} 周前`:`${delta} 周后`;
  weekRange.textContent=`${fmtShort(start)} — ${fmtShort(end)} · 左右滑动切换周`;
  weekDays.innerHTML=Array.from({length:7},(_,i)=>{
    const d=addDays(start,i),date=isoDate(d);
    const has=HISTORY.some(x=>x.date===date);
    return `<button class="week-day ${has?'has-note':''} ${date===selectedDate?'selected':''}" data-date="${date}"><span class="wd">${WEEK_NAMES[i].slice(1)}</span><span class="dn">${d.getDate()}</span></button>`;
  }).join('');
  weekDays.querySelectorAll('.week-day').forEach(b=>b.addEventListener('click',()=>{
    if(weekDidSwipe)return;
    renderDay(b.dataset.date);
  }));
}
function shiftWeek(step){
  const oldWeekday=(parseISO(selectedDate).getDay()+6)%7;
  weekAnchor=addDays(mondayOf(weekAnchor),step*7);
  const next=addDays(mondayOf(weekAnchor),oldWeekday);
  weekPanel.classList.remove('slide-left','slide-right');
  void weekPanel.offsetWidth;
  weekPanel.classList.add(step>0?'slide-left':'slide-right');
  renderDay(isoDate(next));
}
let weekStartX=0,weekDragging=false,weekDidSwipe=false;
weekPanel.addEventListener('pointerdown',e=>{
  if(e.target.closest('.calendar-btn'))return;
  weekDragging=true;weekDidSwipe=false;weekStartX=e.clientX;
  // 注意：不要在这里 setPointerCapture——它会把 pointerup 重定向到面板，
  // 导致日期按钮的 click 序列断裂、点选失效。改为把 up 挂在 window 上兜底。
});
window.addEventListener('pointerup',e=>{
  if(!weekDragging)return;weekDragging=false;
  const dx=e.clientX-weekStartX;
  if(Math.abs(dx)>38){
    weekDidSwipe=true;
    shiftWeek(dx<0?1:-1);
    setTimeout(()=>weekDidSwipe=false,60);
  }
});
weekPanel.addEventListener('pointercancel',()=>{weekDragging=false;weekDidSwipe=false});

function selectDate(date){
  weekAnchor=parseISO(date);
  calendarPop.hidden=true;

}
function renderCalendar(){
  const year=calMonth.getFullYear(),month=calMonth.getMonth();
  document.querySelector('.cal-head strong').textContent=`${year}年${month+1}月`;
  const first=(new Date(year,month,1).getDay()+6)%7;
  const total=new Date(year,month+1,0).getDate();
  const noteDates=new Set(HISTORY.filter(x=>x.date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)).map(x=>Number(x.date.slice(-2))));
  const cells=[];
  for(let i=0;i<first;i++)cells.push('<button class="cal-day muted" disabled></button>');
  for(let d=1;d<=total;d++){
    const date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push(`<button class="cal-day ${noteDates.has(d)?'has-note':''} ${selectedDate===date?'selected':''}" data-date="${date}">${d}</button>`);
  }
  calDays.innerHTML=cells.join('');
  calDays.querySelectorAll('[data-date]').forEach(b=>b.addEventListener('click',()=>selectDate(b.dataset.date)));
}
document.getElementById('calPrev').addEventListener('click',()=>{

/* 顶边两个圆形凹口：圆心 = 两个圆钮中心（贴顶边），凹口半径比钮大 5px 留白 */

function drawHeroShape(){
  const shape=document.getElementById('heroShape');

  // 用 clientWidth（布局宽度），不能用 getBoundingClientRect——
  // 后者会受 expandIn 动画的 scale(.9) 影响，导致 viewBox 与实际尺寸不符，

  const W=hero.clientWidth||348, H=192;

    `<path fill="${heroFill}" d="M26 0 H${c1-r} A${r} ${r} 0 0 0 ${c1+r} 0 H${c2-r} A${r} ${r} 0 0 0 ${c2+r} 0 H${W-26} A26 26 0 0 1 ${W} 26 V${H-26} A26 26 0 0 1 ${W-26} ${H} H26 A26 26 0 0 1 0 ${H-26} V26 A26 26 0 0 1 26 0 Z"/>`;
}

const CARD_SKINS=[
  {bg:'#6192FC',light:false},
  {bg:'#11358B',light:false},

  {bg:'#A9C0EE',light:true},

];

function drawShareCard(cv,n,skin,opt){
  // 先按原文行数预估画布高度，避免与关键词区重叠
  const W=720;
  let H=900;
  if(opt.raw){
    const probe=document.createElement('canvas').getContext('2d');
    probe.font='400 25px "Noto Serif SC",Songti SC,serif';
    let rl='',rows=1;const rmax=W-108-92+40;
    for(const c of n.raw){
      if(probe.measureText(rl+c).width>rmax){rl=c;rows++} else rl+=c;
    }
    H=900+rows*42+66;
  }
  cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  x.fillStyle='#EFF0F4';x.fillRect(0,0,W,H);
  const m=54,cw=W-m*2,ch=H-m*2;
  x.save();
  x.shadowColor='rgba(17,53,139,.22)';x.shadowBlur=42;x.shadowOffsetY=18;
  x.fillStyle=skin.bg;
  x.beginPath();x.roundRect(m,m,cw,ch,44);x.fill();
  x.restore();
  const ink=skin.light?'#14161c':'#ffffff';
  const sub=skin.light?'rgba(20,22,28,.6)':'rgba(255,255,255,.78)';
  // 分组 + 时间
  x.fillStyle=sub;x.font='600 24px "Noto Sans SC",sans-serif';
  x.fillText(`# ${n.group}   ·   ${n.time}`,m+44,m+70);
  // 引号
  x.fillStyle=skin.light?'rgba(20,22,28,.16)':'rgba(255,255,255,.3)';
  x.font='700 92px Georgia,serif';x.fillText('“',m+40,m+168);
  // 一句话（自动折行）
  x.fillStyle=ink;x.font='900 40px "Noto Sans SC",sans-serif';
  let line='',ly=m+250;const maxW=cw-88;
  for(const c2 of n.t){
    if(x.measureText(line+c2).width>maxW){x.fillText(line,m+44,ly);line=c2;ly+=58;}
    else line+=c2;
  }
  x.fillText(line,m+44,ly);
  // 章节摘要
  x.fillStyle=sub;x.font='500 26px "Noto Sans SC",sans-serif';
  let sy=ly+76;
  n.seg.forEach((s,i)=>{x.fillText(`${i+1}   ${s.s}`,m+46,sy);sy+=44;});
  // 可选：口述原文（宋体）
  if(opt.raw){
    sy+=20;
    x.fillStyle=skin.light?'rgba(20,22,28,.10)':'rgba(255,255,255,.24)';
    x.beginPath();x.roundRect(m+44,sy,cw-88,3,2);x.fill();
    sy+=42;
    x.fillStyle=sub;x.font='400 25px "Noto Serif SC",Songti SC,serif';
    let rl='';const rmax=cw-92;
    for(const c2 of n.raw){
      if(x.measureText(rl+c2).width>rmax){x.fillText(rl,m+46,sy);rl=c2;sy+=42;}
      else rl+=c2;
    }
    x.fillText(rl,m+46,sy);
  }
  // 关键词
  let kx=m+44,ky=H-m-118;
  x.font='700 22px "Noto Sans SC",sans-serif';
  n.kw.forEach(k=>{
    const tw=x.measureText(k).width+34;
    if(kx+tw>W-m-44){kx=m+44;ky+=46;}
    x.fillStyle=skin.light?'rgba(20,22,28,.08)':'rgba(255,255,255,.22)';
    x.beginPath();x.roundRect(kx,ky-24,tw,34,17);x.fill();
    x.fillStyle=ink;x.fillText(k,kx+17,ky);
    kx+=tw+10;
  });
  // 语音标记 + 品牌字样
  x.fillStyle=sub;x.font='600 22px "Noto Sans SC",sans-serif';
  x.fillText(`🔊 ${n.dur}`,m+44,H-m-48);
  if(opt.brand){
    x.font='900 24px "Noto Sans SC",sans-serif';
    x.fillStyle=skin.light?'rgba(20,22,28,.42)':'rgba(255,255,255,.6)';
    const bw=x.measureText('Aha').width;
    x.fillText('Aha',W-m-44-bw,H-m-48);
  }
}

/* ---------- 按住说话 ---------- */
const talk=document.getElementById('talk');
const toast=document.getElementById('toast');
const cancelZone=document.getElementById('cancelZone');
const recTip=document.getElementById('recTip');
let holdT=null,startY=0,willCancel=false,recSec=0,recTimer=null,tip40=null;

/* 兜底转写：浏览器内置语音识别（与录音并行跑，腾讯云 ASR 不可用时顶上） */
let wsRec=null,wsRaw='';
function startWebSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  try{
    wsRec=new SR();wsRec.lang='zh-CN';wsRec.continuous=true;wsRec.interimResults=true;
    wsRaw='';
    wsRec.onresult=ev=>{let t='';for(const r of ev.results)t+=r[0].transcript;wsRaw=t};
    wsRec.onerror=()=>{};
    wsRec.start();
  }catch{wsRec=null}
}
function stopWebSpeech(){try{wsRec&&wsRec.stop()}catch{};wsRec=null}

/* 真实录音（MediaRecorder） */
let rec=null,recStream=null,recChunks=[];
async function startRec(){
  try{
    recStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch{
    flash('无法访问麦克风');return false;
  }
  startWebSpeech();
  recChunks=[];
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported?.(m));
  rec=new MediaRecorder(recStream,mime?{mimeType:mime}:undefined);
  rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  rec.onstop=()=>{
    pendingBlob=new Blob(recChunks,{type:rec.mimeType||'audio/webm'});
    recStream.getTracks().forEach(t=>t.stop());
  };
  rec.start(250);
  return true;
}
function stopRec(){stopWebSpeech();try{rec&&rec.state!=='inactive'&&rec.stop()}catch{}}

talk.addEventListener('pointerdown',async e=>{
  const ok=await startRec();
  if(!ok)return;
  talk.setPointerCapture(e.pointerId);
  talk.classList.add('holding');
  talk.textContent='松开 结束';
  startY=e.clientY;willCancel=false;recSec=0;
  cancelZone.classList.add('show');
  // 计时：40s 长录提示 → 55s 变色倒计时 → 60s 自动结束并保存（绝不丢弃）
  recTimer=setInterval(()=>{
    recSec++;
    if(recSec===40){recTip.textContent='这段挺长，记完可以生成分享卡片';recTip.classList.add('show')}
    if(recSec>=55){talk.classList.add('near-limit');talk.textContent=`${60-recSec}s 后自动保存`}
    if(recSec>=60){release(true)}
  },1000);
});
talk.addEventListener('pointermove',e=>{
  if(!talk.classList.contains('holding'))return;
  willCancel=(startY-e.clientY)>54;      // 上滑超过阈值进入取消区
  cancelZone.classList.toggle('armed',willCancel);
  talk.classList.toggle('to-cancel',willCancel);
  if(!willCancel&&recSec<55)talk.textContent='松开 结束';
  if(willCancel)talk.textContent='松开 取消';
});
function release(auto){
  if(!talk.classList.contains('holding'))return;
  clearInterval(recTimer);clearTimeout(tip40);
  talk.classList.remove('holding','to-cancel','near-limit');
  talk.textContent='按住说话';
  cancelZone.classList.remove('show','armed');
  recTip.classList.remove('show');
  const cancelled=willCancel;
  willCancel=false;
  stopRec();
  if(cancelled){pendingBlob=null;flash('已取消');return}
  // 松手即存 → 立刻进入生成卡片界面（转写在界面里异步进行，用户不用等）
  flash(auto?'已到 60s，自动记下 ✎':'已记下 ✎ 转写中…');
  setTimeout(()=>openGenerated(),380);
}
talk.addEventListener('pointerup',()=>release(false));
talk.addEventListener('pointercancel',()=>release(false));

/* ================= 真实管线：录音/上传 → ASR → LLM → 生成卡片 ================= */

/* API 基址：GitHub Pages 上指向 Vercel 代理，本地/同源则留空 */
const API_BASE=(()=>{
  const q=new URLSearchParams(location.search).get('api');
  if(q)return q;
  return location.hostname.endsWith('github.io')?'https://aha-prototype.vercel.app':'';
})();

/* --- 音频工具：解码 → 降采样 16kHz 单声道 → MP3(24kbps) --- */
function downsampleTo16k(buf){
  const src=buf.getChannelData(0);
  const ch=buf.numberOfChannels;
  // 多声道取平均
  let mono=src;
  if(ch>1){
    mono=new Float32Array(src.length);
    for(let c=0;c<ch;c++){
      const d=buf.getChannelData(c);
      for(let i=0;i<src.length;i++)mono[i]+=d[i]/ch;
    }
  }
  if(buf.sampleRate===16000)return mono;
  const ratio=buf.sampleRate/16000;
  const outLen=Math.floor(mono.length/ratio);
  const out=new Float32Array(outLen);
  for(let i=0;i<outLen;i++){
    const p=i*ratio, i0=Math.floor(p), i1=Math.min(i0+1,mono.length-1), f=p-i0;
    out[i]=mono[i0]*(1-f)+mono[i1]*f;
  }
  return out;
}
function floatTo16(input){
  const out=new Int16Array(input.length);
  for(let i=0;i<input.length;i++){
    const s=Math.max(-1,Math.min(1,input[i]));
    out[i]=s<0?s*0x8000:s*0x7FFF;
  }
  return out;
}
function encodeMp3(i16){
  if(typeof lamejs==='undefined')throw new Error('MP3 编码器未加载');
  const enc=new lamejs.Mp3Encoder(1,16000,24);   // 24kbps：2 分钟 ≈ 360KB，base64 后仍低于 600KB 上限
  const CHUNK=1152,parts=[];
  for(let i=0;i<i16.length;i+=CHUNK){
    const buf=i16.subarray(i,i+CHUNK);
    const mp3=enc.encodeBuffer(buf);
    if(mp3.length)parts.push(mp3);
  }
  const end=enc.flush();
  if(end.length)parts.push(end);
  const bytes=new Uint8Array(parts.reduce((s,p)=>s+p.length,0));
  let o=0;for(const p of parts){bytes.set(p,o);o+=p.length}
  return bytes;
}
function toBase64(u8){
  let s='';const CH=0x8000;
  for(let i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
  return btoa(s);
}
/* 从 PCM 算 34 根波形柱（真实音频特征） */
function waveBars(mono,bars=34){
  const step=Math.floor(mono.length/bars)||1;
  const out=[];
  for(let i=0;i<bars;i++){
    let peak=0;
    for(let j=0;j<step;j++)peak=Math.max(peak,Math.abs(mono[i*step+j]||0));
    out.push(Math.min(100,Math.round(peak*160)+14));
  }
  return out;
}
async function audioBlobToPayload(blob){
  const AC=window.AudioContext||window.webkitAudioContext;
  const ac=new AC();
  const buf=await ac.decodeAudioData(await blob.arrayBuffer());
  const mono=downsampleTo16k(buf);
  const mp3=encodeMp3(floatTo16(mono));
  ac.close?.();
  return {base64:toBase64(mp3),duration:buf.duration,bars:waveBars(mono),size:mp3.length};
}
function fmtDur(sec){
  const s=Math.max(0,Math.round(sec));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

/* --- 调后端 --- */
async function api(path,body){
  const r=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:'网络异常'}));
  if(j.error)throw new Error(j.error);
  return j;
}

/* --- 生成一条便签并入库 --- */
function makeNote({raw,gen,duration,bars,audioUrl,img}){
  const bj=bjNow();
  const date=bj.date;
  const time=`今天 ${bj.time}`;
  let group=gen?.tag||'生活灵感';
  let isNew=!!gen?.tagIsNew;
  if(!GROUPS[group]){
    // LLM 提议的新标签：临时入库，呈虚线待确认态
    const palette=[{bg:'#6192FC',light:false},{bg:'#C7EF66',light:true},{bg:'#A9C0EE',light:true},{bg:'#11358B',light:false}];
    const p=palette[Object.keys(GROUPS).length%palette.length];
    GROUPS[group]={icon:'✦',bg:p.bg,light:p.light,accent:'#11358B'};
    isNew=true;
  }
  const note={
    date,time,group,type:'tag',
    t:gen?.oneLiner||(img?'图片随记':(raw&&raw!=='(转写待补)'?raw.slice(0,24):'语音便签 · 转写待补')),
    dur:duration?fmtDur(duration):'—',
    tagState:isNew?'suggested':'confirmed',
    raw:raw||'',
    seg:(gen?.segments||[]).filter(Boolean).map(s=>({s:String(s).slice(0,20)})),
    kw:gen?.keywords||[],
    audioUrl:audioUrl||null,
    bars:bars||null,
    img:img||null,
  };
  if(!note.seg.length)note.seg=[{s:'（暂无摘要）'}];
  HISTORY.unshift(note);
  CARDS.unshift({
    key:`${date}|${time}`,title:note.t,
    text:note.raw.slice(0,60)||note.t,
    img:note.img||null,
    time:'刚刚',tag:'# '+note.group,
    rot:Math.round((Math.random()*8-4)*10)/10,
    ring:GROUPS[note.group].bg,
  });
  cur=0;buildCarousel();layout();
  renderProjects();renderDay(date);
  return note;
}

/* --- 主流程：音频 → ASR → LLM → 卡片 --- */
async function processAudio(blob,{maxSec=125}={}){
  const p=await audioBlobToPayload(blob);
  if(p.duration>maxSec)throw new Error(`音频 ${fmtDur(p.duration)}，超过 2 分钟`);
  const audioUrl=URL.createObjectURL(blob);
  let raw='';
  try{
    const a=await api('/api/asr',{data:p.base64,format:'mp3'});
    raw=a.text||'';
  }catch(e){
    console.warn('ASR 失败：',e.message);
    raw='';
  }
  if(!raw&&wsRaw)raw=wsRaw;      // 兜底：用浏览器识别结果
  if(!raw)return makeNote({raw:'(转写待补)',gen:null,duration:p.duration,bars:p.bars,audioUrl});
  let gen=null;
  try{
    gen=await api('/api/llm',{transcript:raw,tags:Object.keys(GROUPS)});
  }catch(e){
    console.warn('LLM 失败：',e.message);
  }
  return makeNote({raw,gen,duration:p.duration,bars:p.bars,audioUrl});
}

/* --- 图片上传（V1 不做 OCR，图片只作情绪载体） --- */
function readAsDataURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)})}

/* 处理中的状态浮层 */
function setBusy(on,msg){
  const b=document.getElementById('busyBar');
  if(!b)return;
  b.hidden=!on;
  if(on)b.querySelector('span').textContent=msg;
}

/* 松手后：真实生成（录音结束已把 blob 存到 pendingBlob） */
let pendingBlob=null;
async function openGenerated(){
  if(!pendingBlob){flash('没有可处理的音频');return}
  const blob=pendingBlob;pendingBlob=null;
  setBusy(true,'转写并生成卡片…');
  try{
    const note=await processAudio(blob,{maxSec:125});
    openNote(`${note.date}|${note.time}`,'capture');
    flash('卡片已生成 ✓');
  }catch(e){
    flash(e.message||'生成失败');
  }finally{
    setBusy(false);
  }
}

document.getElementById('audioPick').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  setBusy(true,'转写并生成卡片…');
  try{
    const note=await processAudio(f,{maxSec:125});
    openNote(`${note.date}|${note.time}`,'capture');
