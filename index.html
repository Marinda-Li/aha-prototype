<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Aha · 一声就记下</title>
<link rel="icon" href="assets/logo.png">
<style>
/* ============ v0.4 · CSS 便利贴卡（内容全收框内）+ 可翻牌叠放 + 双图标导航 ============ */
:root{
  --bg:#FFFFFF; --ink:#111114; --ink-2:#6B6B72; --ink-3:#AEAEB6;
  --fill:#F2F2F5; --line:#ECECF0;
  --blue:#0A84FF; --blue-deep:#0066D6; --blue-soft:#EAF2FF;
  --green:#34C759; --orange:#FF9F0A; --red:#FF3B30;
  --b0:#A8CBF5; --b1:#A9E4C0; --b2:#D9C8F5; --b3:#F5C6DA;   /* 便利贴描边 */
  --shadow:0 10px 30px rgba(0,0,0,.08);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:#E9E9EE;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--ink)}

.phone{width:100%;max-width:400px;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:480px){
  .phone{height:min(844px,96vh);border-radius:44px;border:10px solid #151517;box-shadow:0 30px 80px rgba(0,0,0,.3)}
}
.view{flex:1;overflow-y:auto;overscroll-behavior:contain;display:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.active{display:block}

/* ============ 顶部双图标导航：左 ☰ 记住灵感 · 右 ⟳ 往期记录 ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px}
.navbtn{width:44px;height:44px;border-radius:50%;background:var(--fill);border:none;font-size:18px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:all .2s}
.navbtn.here{background:var(--blue-soft);color:var(--blue)}
.navbtn .cnt{position:absolute;top:-3px;right:-3px;background:var(--blue);color:#fff;font-size:9.5px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
.topbar .logo{height:30px;border-radius:8px}

/* 问候区 */
.greet{padding:24px 26px 4px;text-align:center}
.greet .g-main{font-size:24px;font-weight:700;letter-spacing:.5px}
.greet .g-main::before{content:"“"}.greet .g-main::after{content:"”"}
.greet .g-sub{margin-top:8px;font-size:13px;color:var(--ink-3)}

/* ============ 便利贴卡（CSS 绘制：白卡+彩描边+引号+黑胶囊，全在框内） ============ */
.card{position:relative;background:#fff;border:2px solid var(--b0);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.card.b0{border-color:var(--b0)}.card.b1{border-color:var(--b1)}
.card.b2{border-color:var(--b2)}.card.b3{border-color:var(--b3)}
.card .inner{position:absolute;inset:0;padding:20px 20px 14px;display:flex;flex-direction:column}
.qm{font-family:var(--serif);font-size:38px;line-height:1;color:rgba(0,0,0,.13);position:absolute;pointer-events:none}
.qm.tl{top:12px;left:16px}
.qm.br{right:16px;bottom:64px}
.oneliner{font-size:20px;font-weight:700;line-height:1.5;margin-top:26px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.oneliner.loading{color:var(--ink-3);font-weight:400;font-size:16px}
/* 黑胶囊播放键（卡内右下） */
.playpill{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:8px 16px;font-size:12px;cursor:pointer;font-family:var(--sans);width:fit-content}
.playpill .pp-ic{font-size:9px}
.pp-bars{display:inline-flex;align-items:center;gap:2px;height:11px}
.pp-bars i{width:2.5px;background:#fff;border-radius:2px;height:4px}
.playpill.playing .pp-bars i{animation:ppb .7s ease-in-out infinite alternate}
@keyframes ppb{from{transform:scaleY(.4)}to{transform:scaleY(1.7)}}
/* 摘要节选 + 渐隐遮罩 */
.excerpt{margin-top:10px;font-size:13px;line-height:1.75;color:rgba(0,0,0,.6);max-height:70px;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 35%,transparent 98%);mask-image:linear-gradient(#000 35%,transparent 98%)}
.card .spacer{flex:1}
.cardfoot{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3)}
.cardfoot .playpill{margin-left:auto}
.kbadge{border-radius:8px;padding:2.5px 9px;font-size:10.5px;font-weight:600;color:#fff}
.kbadge.idea{background:var(--orange)}.kbadge.todo{background:var(--green)}
/* 骨架 */
.skel{margin-top:26px}
.skel i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.11) 50%,rgba(0,0,0,.05) 75%);background-size:200% 100%;animation:shim 1.2s infinite;margin-bottom:10px}
.skel .sk-t{font-size:11px;color:rgba(0,0,0,.4)}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

/* ============ 首页叠放堆：点哪张哪张到最前 ============ */
.stack{position:relative;width:84%;aspect-ratio:1/1;margin:26px auto 10px}
.stk{position:absolute;inset:0;cursor:pointer;transition:transform .38s cubic-bezier(.2,.8,.3,1.08),opacity .3s,box-shadow .3s}
.stk.p0{z-index:3;transform:none}
.stk.p1{z-index:2;transform:translate(20px,-16px) rotate(4deg) scale(.95)}
.stk.p2{z-index:1;transform:translate(38px,-30px) rotate(8deg) scale(.9);opacity:.95}
.stk.p0:active{transform:scale(.985)}
.stk .peek{margin-top:30px;font-size:16px;font-weight:600;line-height:1.55;color:rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* 空状态 */
.empty{padding:50px 30px;text-align:center;color:var(--ink-3);font-size:13px;line-height:2}
.empty img{width:120px;margin-bottom:6px}

/* ============ 底部输入条 ============ */
.inputbar{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg)}
.kbd{width:46px;height:46px;border-radius:50%;background:var(--fill);border:none;font-size:18px;color:var(--ink);cursor:pointer;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
.talk{flex:1;height:52px;border-radius:999px;background:var(--blue);border:none;font-size:15.5px;color:#fff;font-weight:600;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--sans);letter-spacing:1px;transition:background .15s;box-shadow:0 6px 18px rgba(10,132,255,.28)}
.talk.pressing{background:var(--blue-deep)}

/* ============ 录音浮层 ============ */
.rec-ov{position:absolute;inset:0;background:rgba(15,15,20,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;z-index:40}
.rec-ov.on{display:block}
.rec-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:22px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;animation:rise .22s ease}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.cats{display:flex;justify-content:center;gap:34px;margin-bottom:6px;transition:opacity .2s;opacity:.35}
.cats.armed-zone{opacity:1}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2)}
.cat .c-ic{width:62px;height:62px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:24px;transition:all .15s;border:2px solid transparent}
#catTodo.armed .c-ic{background:var(--green);color:#fff;transform:scale(1.14)}
#catIdea.armed .c-ic{background:var(--orange);color:#fff;transform:scale(1.14)}
.cat.armed{color:var(--ink);font-weight:600}
.rec-timer{font-size:32px;font-weight:300;font-variant-numeric:tabular-nums;margin-top:8px}
.rec-timer.warn{color:var(--red);font-weight:600}
.rec-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:48px;margin:8px 0 4px}
.rec-wave i{width:4px;border-radius:3px;background:var(--blue);transition:height .08s}
.rec-hint{font-size:12.5px;color:var(--ink-2);min-height:20px}
.rec-cancel{margin:10px auto 0;width:58px;height:58px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-2);transition:all .15s}
.rec-cancel.armed{background:var(--red);color:#fff;transform:scale(1.15)}
.rec-sub{font-size:10.5px;color:var(--ink-3);margin-top:8px}

/* ============ 详情页 / 录后确认页 ============ */
.noteview{position:absolute;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
.noteview.on{display:flex}
.nv-bar{display:flex;align-items:center;padding:14px 16px}
.nv-bar button{background:none;border:none;font-size:15px;cursor:pointer;color:var(--ink-2);padding:6px}
.nv-bar .nv-title{font-size:14px;font-weight:600;color:var(--ink);margin-left:8px}
.nv-scroll{flex:1;overflow-y:auto;padding:6px 22px 20px;scrollbar-width:none}
.nv-scroll::-webkit-scrollbar{display:none}
.nv-card{position:relative;width:100%;aspect-ratio:1/1;animation:drop .4s ease}
@keyframes drop{from{transform:translateY(-14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.nv-card .oneliner{-webkit-line-clamp:4}
.nv-card img.nv-img{width:100%;border-radius:12px;margin-top:10px}
/* 摘要卡 */
.sumcard{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.sum-head{display:flex;align-items:center;font-size:12px;color:var(--ink-3);padding-bottom:8px}
.sum-head .swap{margin-left:auto;background:var(--blue-soft);border:none;border-radius:999px;padding:5px 13px;font-size:11.5px;color:var(--blue);cursor:pointer;font-weight:600}
.sum-body{font-size:14.5px;line-height:1.85;color:#3A3A40;white-space:pre-wrap;word-break:break-word}
.sum-body .seg{display:block;opacity:0;transform:translateY(6px);animation:segIn .4s ease forwards;margin-bottom:7px}
.sum-body .seg .n{color:var(--blue);margin-right:6px;font-size:12px;font-weight:600}
@keyframes segIn{to{opacity:1;transform:none}}
/* 候选标签 */
.tagrow{display:flex;flex-wrap:wrap;gap:8px;padding:14px 2px 4px}
.kw{border:1.5px solid #E2E2E8;background:#fff;color:var(--ink-2);border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;transition:all .18s}
.kw.lit{background:var(--blue);color:#fff;border-color:var(--blue);transform:scale(1.05);box-shadow:0 3px 10px rgba(10,132,255,.3)}
.kw-hint{font-size:11.5px;color:var(--ink-3);width:100%}
.nv-done{flex:none;margin:0 20px calc(18px + env(safe-area-inset-bottom));height:52px;border:none;border-radius:999px;background:var(--blue);color:#fff;font-size:15.5px;font-weight:600;cursor:pointer;font-family:var(--sans);box-shadow:0 6px 18px rgba(10,132,255,.3);display:none}
.nv-done.on{display:block}
.nv-meta{flex:none;text-align:center;font-size:11.5px;color:var(--ink-3);padding-bottom:calc(16px + env(safe-area-inset-bottom));display:none}
.nv-meta.on{display:block}

/* ============ 打字 / 图片 ============ */
.overlay{position:absolute;inset:0;background:var(--bg);z-index:55;display:none;flex-direction:column}
.overlay.on{display:flex}
.ov-bar{display:flex;align-items:center;padding:14px 16px}
.ov-bar button{background:none;border:none;font-size:15px;cursor:pointer;color:var(--ink-2);padding:6px}
.ov-bar .save{margin-left:auto;color:var(--blue);font-weight:600}
.ov-bar .draft{font-size:11px;color:var(--ink-3);margin-left:10px}
.overlay textarea{flex:1;border:none;outline:none;resize:none;background:transparent;color:var(--ink);font-size:17px;line-height:1.8;padding:14px 22px;font-family:var(--sans)}
.imgcom .preview{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.imgcom .preview img{max-width:100%;max-height:100%;border-radius:16px;box-shadow:var(--shadow)}
.imgcom textarea{flex:none;height:92px;margin:0 16px 16px;background:var(--fill);border-radius:14px;padding:14px 16px;font-size:15px}

/* ============ 分享页 ============ */
.share-ov{position:absolute;inset:0;background:rgba(15,15,20,.72);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:28px}
.share-ov.on{display:flex}
.share-ov .s-title{color:#fff;font-size:14px;letter-spacing:2px;opacity:.85}
.share-ov canvas{max-width:100%;max-height:64%;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.share-ov .s-btns{display:flex;gap:12px}
.share-ov button{border:none;border-radius:999px;padding:12px 24px;font-size:14px;cursor:pointer;font-family:var(--sans)}
.share-ov .dl{background:#fff;color:var(--ink);font-weight:600}
.share-ov .cl{background:rgba(255,255,255,.16);color:#fff}

/* ============ 灵感录 ============ */
.lib-head{display:flex;align-items:center;padding:6px 18px 4px}
.lib-head .t{font-size:22px;font-weight:700;margin-left:12px}
.pills{display:flex;gap:8px;padding:14px 18px 6px}
.pill{border:none;background:var(--fill);color:var(--ink-2);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
.pill.on{background:var(--blue);color:#fff;font-weight:600}
.pill .n{opacity:.65;font-size:11px;margin-left:3px}
.lib-item{display:flex;align-items:center;gap:13px;margin:10px 18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;animation:drop .35s ease}
.li-thumb{width:46px;height:46px;border-radius:13px;background:#fff;border:1.5px solid var(--b0);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;color:rgba(0,0,0,.16)}
.li-thumb.b0{border-color:var(--b0)}.li-thumb.b1{border-color:var(--b1)}
.li-thumb.b2{border-color:var(--b2)}.li-thumb.b3{border-color:var(--b3)}
.lib-item .li-main{flex:1;min-width:0}
.lib-item .li-one{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-item .li-meta{margin-top:5px;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-3)}
.lib-item .li-share{background:var(--blue-soft);border:none;border-radius:50%;width:34px;height:34px;color:var(--blue);font-size:14px;cursor:pointer;flex:none}
.lib-reset{display:block;margin:26px auto 30px;background:none;border:none;color:var(--ink-3);font-size:11.5px;cursor:pointer}

/* Toast */
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);background:rgba(17,17,20,.92);color:#fff;font-size:13px;padding:10px 20px;border-radius:999px;opacity:0;transition:all .25s;z-index:90;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="phone" id="phone">

  <!-- ===== 灵感流（记住灵感） ===== -->
  <div class="view active" id="view-feed">
    <div class="topbar">
      <button class="navbtn here" id="navFeed" onclick="switchTab('feed')" title="记住灵感">☰</button>
      <img class="logo" src="assets/logo.png" alt="Aha">
      <button class="navbtn" id="navLib" onclick="switchTab('lib')" title="往期记录">⟳<span class="cnt" id="noteCnt">0</span></button>
    </div>
    <div class="greet">
      <div class="g-main" id="greetMain">下午好！</div>
      <div class="g-sub" id="greetSub">一声就记下</div>
    </div>
    <div id="stackSlot"></div>
  </div>

  <!-- ===== 灵感录（往期记录） ===== -->
  <div class="view" id="view-lib">
    <div class="topbar">
      <button class="navbtn" onclick="switchTab('feed')" title="记住灵感">☰</button>
      <img class="logo" src="assets/logo.png" alt="Aha">
      <button class="navbtn here" title="往期记录">⟳<span class="cnt" id="noteCnt2">0</span></button>
    </div>
    <div class="lib-head"><div class="t">往期记录</div></div>
    <div class="pills" id="pills">
      <button class="pill on" data-f="all">全部</button>
      <button class="pill" data-f="idea">✨ 灵感</button>
      <button class="pill" data-f="todo">✅ Todo</button>
    </div>
    <div id="libList"></div>
    <button class="lib-reset" onclick="resetAll()">⟳ 重置演示数据</button>
  </div>

  <!-- ===== 底部输入条 ===== -->
  <div class="inputbar" id="inputbar">
    <button class="kbd" id="kbdBtn">⌨️</button>
    <button class="talk" id="talkBtn">按住说话</button>
  </div>

  <!-- ===== 录音浮层 ===== -->
  <div class="rec-ov" id="recOv">
    <div class="rec-panel">
      <div class="cats" id="cats">
        <div class="cat" id="catTodo"><div class="c-ic">✅</div>加到 Todo</div>
        <div class="cat" id="catIdea"><div class="c-ic">✨</div>记为灵感</div>
      </div>
      <div class="rec-timer" id="recTimer">0:00</div>
      <div class="rec-wave" id="recWave"></div>
      <div class="rec-hint" id="recHint">松手：记为灵感 · 上滑选择分类</div>
      <div class="rec-cancel" id="recCancel">✕</div>
      <div class="rec-sub">下滑到这里取消</div>
    </div>
  </div>

  <!-- ===== 便利贴详情页 / 录后确认页 ===== -->
  <div class="noteview" id="noteview">
    <div class="nv-bar">
      <button onclick="closeNoteView()">‹ 返回</button>
      <span class="nv-title" id="nvTitle"></span>
    </div>
    <div class="nv-scroll">
      <div class="card nv-card" id="nvCard"><div class="inner" id="nvInner"></div></div>
      <div class="sumcard" id="nvSumcard">
        <div class="sum-head"><span id="nvSumLabel">分段摘要</span><button class="swap" id="nvSwap">⇄ 原文</button></div>
        <div class="sum-body" id="nvSumBody"></div>
      </div>
      <div class="tagrow" id="nvTags"></div>
    </div>
    <button class="nv-done" id="nvDone">完成，记下来 ✓</button>
    <div class="nv-meta" id="nvMeta"></div>
  </div>

  <!-- ===== 打字 ===== -->
  <div class="overlay" id="editor">
    <div class="ov-bar">
      <button onclick="closeEditor()">‹ 返回</button>
      <span class="draft" id="draftHint"></span>
      <button class="save" onclick="saveText()">完成</button>
    </div>
    <textarea id="editorTa" placeholder="想到什么，写下来…"></textarea>
  </div>

  <!-- ===== 图片附言 ===== -->
  <div class="overlay imgcom" id="imgcom">
    <div class="ov-bar">
      <button onclick="closeImgcom()">‹ 返回</button>
      <button class="save" onclick="saveImage()">完成</button>
    </div>
    <div class="preview"><img id="imgPreview" alt=""></div>
    <textarea id="imgCaption" placeholder="配一句感受（可留空）…"></textarea>
  </div>

  <!-- ===== 分享页 ===== -->
  <div class="share-ov" id="shareOv">
    <div class="s-title">生成分享图</div>
    <canvas id="shareCanvas" width="1080" height="1350"></canvas>
    <div class="s-btns">
      <button class="cl" onclick="closeShare()">关闭</button>
      <button class="dl" onclick="downloadShare()">保存图片</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<script>
/* ============================================================
   Aha 可交互原型 v0.4
   CSS 便利贴卡（内容全在框内）· 叠放翻牌 · 左☰记住灵感 / 右⟳往期记录
   ============================================================ */
"use strict";
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const LS_KEY="aha_v2";
const DAY=86400000;
const BORDERS=["#A8CBF5","#A9E4C0","#D9C8F5","#F5C6DA"];

/* ============================================================
   ★ LLM 接入配置（提示词待用户提供后填入 prompts 即可生效）
   ============================================================ */
const LLM={
  endpoint:"", apiKey:"", model:"",
  prompts:{ oneLiner:"", segments:"", keywords:"" }   // TODO(用户): 变量 {{text}}
};
async function llm(task,text){
  if(LLM.endpoint&&LLM.apiKey&&LLM.prompts[task]){
    try{
      const prompt=LLM.prompts[task].replace("{{text}}",text);
      const r=await fetch(LLM.endpoint,{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+LLM.apiKey},
        body:JSON.stringify({model:LLM.model||"default",messages:[{role:"user",content:prompt}]})});
      const d=await r.json();
      const out=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
      const parsed=parseLLM(task,out);
      if(parsed)return parsed;
    }catch(e){}
  }
  return mockLLM(task,text);
}
function parseLLM(task,out){
  try{const j=JSON.parse(out.slice(out.indexOf("{"),out.lastIndexOf("}")+1));
    if(task==="oneLiner"&&j.oneLiner)return j.oneLiner;
    if(task==="segments"&&Array.isArray(j.segments)&&j.segments.length)return j.segments;
    if(task==="keywords"&&Array.isArray(j.keywords)&&j.keywords.length)return j.keywords.slice(0,5);
  }catch(e){}
  if(task==="oneLiner"&&out.trim())return out.trim().split("\n")[0].slice(0,40);
  return null;
}
/* ---- Mock（真实提示词到位前的演示实现） ---- */
const KW_RULES=[
  [/产品|功能|用户|体验|设计|原型|需求/,"产品"],[/会议|上线|方案|汇报|项目|老板|客户/,"工作"],
  [/书|课程|论文|学会|读完|考试/,"学习"],[/累|烦|开心|焦虑|难过|失眠|压力|心情/,"情绪"],
  [/记得|别忘|提醒|要买|明天|快递|缴费|todo|待办/i,"待办"],[/咖啡|奶茶|饭|猫|狗|天气|地铁|电影|跑[步路]|喝水|瑞幸/,"生活"],
  [/灵感|想到|点子|如果|能不能|突然/,"灵感"],[/健康|锻炼|睡觉|休息/,"健康"],[/钱|预算|成本|价格/,"财务"],
];
function mockLLM(task,text){
  if(task==="oneLiner"){
    const s=(text||"").replace(/\s+/g,"");
    const cut=s.split(/[。！？!?,，；;]/).filter(Boolean)[0]||s;
    return cut.length>26?cut.slice(0,26)+"…":cut||"（空）";
  }
  if(task==="segments"){
    const ss=(text||"").split(/(?<=[。！？!?])/).map(x=>x.trim()).filter(Boolean);
    if(ss.length<=1)return[text||"（无内容）"];
    const segs=[],per=Math.ceil(ss.length/3);
    for(let i=0;i<ss.length;i+=per)segs.push(ss.slice(i,i+per).join(""));
    return segs.slice(0,3);
  }
  if(task==="keywords"){
    const out=[];
    for(const[re,tag]of KW_RULES){if(re.test(text)&&!out.includes(tag))out.push(tag);if(out.length>=5)break}
    for(const pad of["灵感","生活","待办","情绪","工作"]){if(out.length>=3)break;if(!out.includes(pad))out.push(pad)}
    return out;
  }
  return null;
}

function esc(s){return(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtTime(ts){
  const d=new Date(ts),now=new Date();
  const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const t0=new Date(now).setHours(0,0,0,0),d0=new Date(d).setHours(0,0,0,0);
  if(t0===d0)return "今天 "+hm;
  if(t0-d0===DAY)return "昨天 "+hm;
  if(d.getFullYear()===now.getFullYear())return(d.getMonth()+1)+"月"+d.getDate()+"日";
  return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}

  stackOrder=stackOrder.filter(id=>recent.includes(id));
  recent.forEach(id=>{if(!stackOrder.includes(id))stackOrder.push(id)});
  if(newFrontId){stackOrder=[newFrontId,...stackOrder.filter(id=>id!==newFrontId)]}
  stackOrder=stackOrder.slice(0,3);
}

/* ============ 录入后 LLM 流水线（确认页流式呈现） ============ */
async function runPipeline(n){
  n.oneLiner=await llm("oneLiner",n.text);
  save();renderFeed();if(NV.id===n.id)renderNoteView();
  const segs=await llm("segments",n.text);
  n.segments=[];save();
  for(let i=0;i<segs.length;i++){
    await new Promise(r=>setTimeout(r,560));
    n.segments.push(segs[i]);
    if(NV.id===n.id&&!n.showRaw){
      const body=$("#nvSumBody");
      const sp=document.createElement("span");sp.className="seg";
      sp.innerHTML='<span class="n">'+"①②③"[i]+"</span>"+esc(segs[i]);
      body.appendChild(sp);
    }
  }
  n.candTags=await llm("keywords",n.text);
  n.summarized=true;save();renderFeed();renderLib();
  if(NV.id===n.id)renderNoteView();
}

/* ============================================================
   按住说话：松手默认灵感 · 上滑左=Todo 右=灵感 · 下滑取消
   ============================================================ */
const R={active:false,startY:0,startTs:0,zone:null,iv:null,raf:null,recorder:null,stream:null,analyser:null,actx:null,chunks:[]};
function buildWave(){$("#recWave").innerHTML=Array.from({length:26},()=>'<i style="height:6px"></i>').join("")}
async function startRec(e){
  if(R.active)return;
  R.active=true;R.zone=null;R.startTs=Date.now();R.chunks=[];
  R.startY=(e.touches?e.touches[0].clientY:e.clientY);
  $("#recOv").classList.add("on");buildWave();
  $("#recTimer").className="rec-timer";$("#cats").classList.remove("armed-zone");
  $("#catTodo").classList.remove("armed");$("#catIdea").classList.remove("armed");$("#recCancel").classList.remove("armed");
  $("#recHint").textContent="松手：记为灵感 · 上滑选择分类";
  $("#talkBtn").classList.add("pressing");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    R.stream=stream;
    const mime=MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"";
    R.recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
    R.recorder.ondataavailable=ev=>{if(ev.data.size)R.chunks.push(ev.data)};
    R.recorder.start();
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser();an.fftSize=64;src.connect(an);R.analyser=an;R.actx=ctx;
  }catch(err){R.recorder=null}
  R.iv=setInterval(tickRec,200);waveLoop();
}
function tickRec(){
  const s=Math.floor((Date.now()-R.startTs)/1000),t=$("#recTimer");
  t.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  if(s>=55){t.classList.add("warn");t.textContent+=" · "+(60-s)+"s"}
  if(s>=60)finishRec();
}
function waveLoop(){
  if(!R.active)return;
  const bars=$("#recWave").children;let data=null;
  if(R.analyser){data=new Uint8Array(R.analyser.frequencyBinCount);R.analyser.getByteFrequencyData(data)}
  for(let i=0;i<bars.length;i++){
    let h=data?4+(data[Math.floor(i*data.length/bars.length)]/255)*40:4+Math.random()*38;
    bars[i].style.height=h.toFixed(0)+"px";
  }
  R.raf=requestAnimationFrame(waveLoop);
}
function moveRec(e){
  if(!R.active)return;
  const pt=e.touches?e.touches[0]:e;
  const dy=R.startY-pt.clientY;
  const mid=window.innerWidth/2;
  let zone=null;
  if(dy>60)zone=pt.clientX<mid?"todo":"idea";
  else if(dy<-70)zone="cancel";
  if(zone!==R.zone){
    R.zone=zone;
    $("#cats").classList.toggle("armed-zone",zone==="todo"||zone==="idea");
    $("#catTodo").classList.toggle("armed",zone==="todo");
    $("#catIdea").classList.toggle("armed",zone==="idea");
    $("#recCancel").classList.toggle("armed",zone==="cancel");
    $("#recHint").textContent=zone==="todo"?"松手：加到 Todo":zone==="idea"?"松手：记为灵感":zone==="cancel"?"松手取消这条":"松手：记为灵感 · 上滑选择分类";
  }
}
function finishRec(){
  if(!R.active)return;
  R.active=false;clearInterval(R.iv);cancelAnimationFrame(R.raf);
  const dur=Date.now()-R.startTs,zone=R.zone;
  $("#recOv").classList.remove("on");$("#talkBtn").classList.remove("pressing");
  const done=blob=>{
    if(R.stream)R.stream.getTracks().forEach(t=>t.stop());
    if(R.actx)R.actx.close().catch(()=>{});
    if(zone==="cancel"){toast("已取消");return}
    if(dur<600){toast("说话时间太短");return}
    const kind=zone==="todo"?"todo":"idea";
    const n=addNote(kind,{assets:[{id:uid(),kind:"audio",durationMs:dur}],transcribing:true});
    if(blob)audioBlobs[n.id]=URL.createObjectURL(blob);
    openNoteView(n.id,"confirm");
    setTimeout(async()=>{
      n.text=MOCK_TRANSCRIPTS[Math.floor(Math.random()*MOCK_TRANSCRIPTS.length)];
      n.transcribing=false;n.updatedAt=Date.now();save();renderFeed();
      if(NV.id===n.id)renderNoteView();
      await runPipeline(n);
    },1400);
  };
  if(R.recorder&&R.recorder.state!=="inactive"){
    R.recorder.onstop=()=>done(new Blob(R.chunks,{type:R.recorder.mimeType||"audio/mp4"}));
    R.recorder.stop();
  }else done(null);
}
(function bindTalk(){
  const b=$("#talkBtn");
  b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);startRec(e)});
  b.addEventListener("pointermove",e=>{e.preventDefault();moveRec(e)});
  b.addEventListener("pointerup",()=>finishRec());
  b.addEventListener("pointercancel",()=>finishRec());
  b.addEventListener("contextmenu",e=>e.preventDefault());
})();

/* ============================================================
   键盘图标：点按=打字 · 长按上滑=图片录入
   ============================================================ */
(function bindKbd(){
  const b=$("#kbdBtn");
  let timer=null,startY=0,consumed=false,holding=false;
  b.addEventListener("pointerdown",e=>{
    e.preventDefault();b.setPointerCapture(e.pointerId);
    consumed=false;holding=true;startY=e.clientY;
    timer=setTimeout(()=>{if(holding&&!consumed)toast("继续上滑 → 切换图片录入")},450);
  });
  b.addEventListener("pointermove",e=>{
    if(!holding||consumed)return;
    if(startY-e.clientY>50){consumed=true;holding=false;clearTimeout(timer);pickImage()}
  });
  b.addEventListener("pointerup",()=>{
    clearTimeout(timer);
    if(!consumed&&holding)openEditor();
    holding=false;
  });
  b.addEventListener("pointercancel",()=>{clearTimeout(timer);holding=false});
  b.addEventListener("contextmenu",e=>e.preventDefault());
})();

/* ============ 打字（同样进确认页） ============ */
function openEditor(){
  $("#editor").classList.add("on");
  const ta=$("#editorTa");
  ta.value=localStorage.getItem("aha_draft2")||"";
  $("#draftHint").textContent=ta.value?"已恢复草稿":"";
  ta.focus();
  ta.oninput=()=>{localStorage.setItem("aha_draft2",ta.value);$("#draftHint").textContent=ta.value?"草稿已存":""};
}
function closeEditor(){$("#editor").classList.remove("on")}
async function saveText(){
  const v=$("#editorTa").value.trim();
  if(!v){closeEditor();return}
  localStorage.removeItem("aha_draft2");closeEditor();
  const n=addNote("idea",{text:v});
  openNoteView(n.id,"confirm");
  await runPipeline(n);
}

/* ============ 图片 ============ */
function pickImage(){$("#fileInput").click()}
$("#fileInput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,800/img.width);
      const c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      $("#imgPreview").src=c.toDataURL("image/jpeg",.8);
      $("#imgCaption").value="";$("#imgcom").classList.add("on");
    };img.src=r.result};
  r.readAsDataURL(f);e.target.value="";
});
function closeImgcom(){$("#imgcom").classList.remove("on")}
async function saveImage(){
  const src=$("#imgPreview").src,cap=$("#imgCaption").value.trim();
  closeImgcom();
  const n=addNote("idea",{assets:[{id:uid(),kind:"image",localPath:src}],text:cap});
  if(cap){openNoteView(n.id,"confirm");await runPipeline(n)}
  else{n.oneLiner="（一张图片）";n.candTags=["生活","记录","图片"];n.summarized=true;save();renderFeed();renderLib()}
}

/* ============ 长按删除 ============ */
function bindLongPress(box){
  box.querySelectorAll("[data-nid]").forEach(el=>{
    let t=null;
    el.addEventListener("touchstart",()=>{t=setTimeout(()=>delNote(el.dataset.nid),560)},{passive:true});
    el.addEventListener("touchend",()=>clearTimeout(t));
    el.addEventListener("touchmove",()=>clearTimeout(t));
  });
}
function delNote(id){
  if(!id||!confirm("删除这条随记？"))return;
  S.notes=S.notes.filter(n=>n.id!==id);
  stackOrder=stackOrder.filter(x=>x!==id);
  save();renderFeed();renderLib();toast("已删除");
}

/* ============================================================
   分享页（CSS 卡同款渲染到画布）
   ============================================================ */
let shareId=null;
function openShare(id){
  const n=S.notes.find(x=>x.id===id);if(!n)return;
  shareId=id;
  const cv=$("#shareCanvas"),ctx=cv.getContext("2d"),W=1080,H=1350;
  ctx.fillStyle="#FFFFFF";ctx.fillRect(0,0,W,H);
  const m=110,cw=W-2*m,ch=cw,y=120;
  /* 白卡 + 彩描边 */
  ctx.fillStyle="#FFFFFF";ctx.strokeStyle=BORDERS[n.border%4];ctx.lineWidth=7;
  rr(ctx,m,y,cw,ch,56);ctx.fill();ctx.stroke();
  /* 引号（框内） */
  ctx.fillStyle="rgba(0,0,0,.13)";ctx.font='110px "Songti SC",serif';
  ctx.fillText("“",m+40,y+120);
  ctx.textAlign="right";ctx.fillText("”",m+cw-40,y+ch-150);ctx.textAlign="left";
  /* 一句话概括（框内） */
  ctx.fillStyle="#111114";ctx.font='700 54px -apple-system,"PingFang SC",sans-serif';
  wrapText(ctx,n.oneLiner||n.text||"",m+56,y+205,cw-112,84);
  /* 黑胶囊播放键（卡内右下） */
  const audio=n.assets.find(a=>a.kind==="audio");
  if(audio){
    const pw=300,ph=84,px=m+cw-pw-56,py=y+ch-ph-56;
    ctx.fillStyle="#111114";rr(ctx,px,py,pw,ph,42);ctx.fill();
    ctx.fillStyle="#FFF";ctx.font='36px sans-serif';
    ctx.fillText("▶  "+fmtDur(audio.durationMs),px+44,py+56);
  }
  /* 标签（卡内左下） */
  ctx.font='34px sans-serif';ctx.fillStyle="#0A84FF";
  const tags=(n.pickedTags&&n.pickedTags.length?n.pickedTags:n.candTags||[]).map(t=>"#"+t).join("  ");
  ctx.fillText(tags,m+56,y+ch-72);
  /* 时间 + 类别 + 品牌（卡外下方） */
  ctx.fillStyle="#AEAEB6";ctx.font='32px sans-serif';
  ctx.fillText(fmtTime(n.createdAt)+" · "+(n.kind==="todo"?"✅ Todo":"✨ 灵感"),m,y+ch+70);
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.textAlign="right";
  ctx.fillText("Aha · 一声就记下",W-m,H-70);ctx.textAlign="left";
  $("#shareOv").classList.add("on");
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrapText(ctx,text,x,y,maxW,lh){
  let line="",yy=y;
  for(const ch of text){
    if(ch==="\n"||ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,yy);line=ch==="\n"?"":ch;yy+=lh}
    else line+=ch;
  }
  if(line)ctx.fillText(line,x,yy);
}
function closeShare(){$("#shareOv").classList.remove("on")}
function downloadShare(){
  const a=document.createElement("a");
  a.download="aha-"+new Date().toISOString().slice(0,10)+".png";
  a.href=$("#shareCanvas").toDataURL("image/png");a.click();
  toast("已保存图片");
}

/* ============ 通用 ============ */
const GREETS=[[5,"早上好"],[11,"中午好"],[14,"下午好"],[18,"晚上好"],[24,"夜深了"]];
const SUBS=["一声就记下","剩下的它替你记住","想到了，说一声","Aha，然后就不会忘了"];
let subIdx=0;
function greet(){
  const h=new Date().getHours();
  const g=GREETS.reduce((acc,[limit,text])=>h<limit?acc||text:acc,null)||GREETS[0][1];
  $("#greetMain").textContent=g+"！";
  $("#greetSub").textContent=SUBS[subIdx%SUBS.length];
}
function switchTab(v){
  $$(".view").forEach(x=>x.classList.remove("active"));
  $("#view-"+v).classList.add("active");
  $("#inputbar").style.visibility=v==="feed"?"visible":"hidden";
  if(v==="lib")renderLib();
}
function resetAll(){if(confirm("清空并恢复演示数据？")){localStorage.removeItem(LS_KEY);localStorage.removeItem("aha_draft2");stackOrder=[];load();renderFeed();renderLib();greet();toast("已重置")}}

/* ============ 启动 ============ */
load();greet();renderFeed();renderLib();
</script>
